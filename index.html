{q:"'Kojo was on the fence about which video game to pick.' What does 'on the fence' mean?",opts:["He couldn't decide","He climbed a fence","He was outside","He was angry"],a:0,topic:"figurative language",teach:[{i:"🤔",t:"'On the fence' is an idiom — a saying that doesn't mean exactly what it says."},{i:"⚖️",t:"Picture sitting on a fence between two yards — you are between two choices."},{i:"💡",t:"So 'on the fence' means stuck between options, unable to decide."}],practice:{q:"'It's raining cats and dogs' means...",opts:["Raining very hard","Pets falling from sky","A little drizzle"],a:0}},
{q:"Which word best completes it? 'The point guard made a ____ pass between two defenders.'",opts:["precise","purple","sleepy","loud"],a:0,topic:"vocabulary",teach:[{i:"🎯",t:"'Precise' means exact and carefully placed."},{i:"🏀",t:"A pass between TWO defenders must be very exact to get through."},{i:"💡",t:"Test each word in the sentence — only 'precise' makes sense."}],practice:{q:"'The chess player made a ____ move to win.'",opts:["clever","sour","fuzzy"],a:0}}

{q:"Yaw missed the game-winning shot. That night he asked his coach for extra practice. What can you tell about Yaw AND what will likely happen next?",opts:["He is determined; he will improve","He is lazy; he will quit","He is scared; he will hide","He is sleepy; he will nap"],a:0,topic:"inference",teach:[{i:"🧩",t:"This needs TWO steps: judge his character, then predict."},{i:"💪",t:"Step 1: He asked for EXTRA practice after failing — that shows determination."},{i:"📈",t:"Step 2: Determined people who practice usually improve. Clues lead to predictions."}],practice:{q:"Adwoa studied her spelling words twice every day before the test. What will likely happen?",opts:["She will do well on the test","She will forget everything","The test will be cancelled"],a:0}},

{q:"'Defeat is a teacher wearing a disguise.' Which statement BEST explains this?",opts:["Losing can teach lessons if you look closely","Teachers wear costumes","You should hide when you lose","Winning is impossible"],a:0,topic:"figurative language",teach:[{i:"🎭",t:"A disguise hides what something really is."},{i:"📚",t:"The quote says defeat — losing — is secretly a teacher."},{i:"💡",t:"Meaning: when you lose, there is a hidden lesson if you search for it."}],practice:{q:"'Mistakes are stepping stones.' This means...",opts:["Mistakes help you move forward","Never step on stones","Mistakes hurt your feet"],a:0}},
{q:"An author writes: 'Some say video games waste time. Yet studies show certain games build problem-solving skills.' What is the author doing?",opts:["Presenting both sides, then supporting one with evidence","Telling a fairy tale","Listing game cheat codes","Describing a basketball play"],a:0,topic:"comprehension",teach:[{i:"⚖️",t:"First the author shows an opposing view: 'Some say...'."},{i:"🔬",t:"Then 'Yet studies show' brings in EVIDENCE for the other side."},{i:"🧠",t:"Authors persuade by naming the other side and answering it with facts."}],practice:{q:"'Some think lions are lazy. But lions can sprint faster than a car on a city street.' The author is...",opts:["Defending lions with a fact","Scaring the reader","Writing a recipe"],a:0}},
{q:"Which sentence uses a semicolon correctly?",opts:["Prince loves basketball; he practices every day.","Prince loves; basketball he practices every day.","Prince; loves basketball he practices every day.","Prince loves basketball he; practices every day."],a:0,topic:"grammar",teach:[{i:"➗",t:"A semicolon joins two complete thoughts that are related."},{i:"✅",t:"'Prince loves basketball' is complete. 'He practices every day' is complete."},{i:"🔗",t:"The semicolon sits between the two complete thoughts — like a bridge."}],practice:{q:"Which is correct?",opts:["Ananse is clever; he always finds a way.","Ananse is; clever he always finds a way.","Ananse; is clever he always."],a:0}},

]

{q:"Ananse wonders: the Moon's gravity is only about one-sixth as strong as Earth's. If Prince jumped on the Moon, he would...",opts:["Jump about 6 times higher than on Earth","Not be able to jump","Fall upward forever","Jump exactly the same"],a:0,topic:"space",teach:[{i:"🌙",t:"The Moon is smaller than Earth, so its gravity is about 6 times weaker."},{i:"🦘",t:"Weaker gravity pulls you down less — so the same jump goes much higher."},{i:"👨‍🚀",t:"That is why astronauts on the Moon bounce like kangaroos in slow motion!"}],practice:{q:"On the Moon, a dropped feather and hammer land together because there is no...",opts:["Air to slow the feather","Gravity at all","Sunlight"],a:0}},

  const set=new Set([ans]);

    if(d>=0&&!set.has(d))set.add(d);

  const opts=shuffle([...set]);

}

/* ---------- WORD PROBLEMS (#1) — single-step first, two-step only after mastery ----------

  return{q:"Prince has "+q1+" quarter"+(q1>1?"s":"")+", "+d+" dime"+(d>1?"s":"")+", and "+n+" nickel"+(n>1?"s":"")+". How much money is that?",...o,topic:"word problems",manip:"coin",

function genWordProblem(){

/* ---------- question selection ---------- */
const ALL_TOPICS=(()=>{const t=new Set();
  for(const s of ["reading","science","history"])for(let l=1;l<=5;l++)BANK[s][l].forEach(q=>t.add(q.topic));
  ["addition","subtraction","multiplication","division","fractions","place value","money","rounding","area","word problems","order of operations"].forEach(x=>t.add(x));
  return [...t];})();

function topicSubject(topic){
  if(typeof LESSON_TOPIC_SUBJECT!=="undefined"&&LESSON_TOPIC_SUBJECT[topic])return LESSON_TOPIC_SUBJECT[topic];
  if(["addition","subtraction","multiplication","division","fractions","place value","money","rounding","area","word problems","order of operations","math"].includes(topic))return "math";
  if(ENGLISH_TOPICS.includes(topic))return "english";
  if(["inference","story structure","comprehension","figurative language"].includes(topic))return "comprehension";
  if(["space","animals","human body","how things work"].includes(topic))return "science";
  return "history";
}

function getQuestion(subject,lvl){
  lvl=Math.max(1,Math.min(5,lvl));
  if(subject==="math"){
    // weekly goal weighting for math topics
    const goal=P&&P.weeklyGoal.topic;
    /* Generated math can repeat the identical sum back-to-back. Keep a short
       memory of recent prompts and re-roll when one comes up again. */
    const recent=(P&&(P._recentMath=P._recentMath||[]))||[];
    const isDupe=q=>q&&recent.indexOf(q.q)>=0;
    const remember=q=>{if(!q||!P)return q;recent.push(q.q);if(recent.length>12)recent.shift();return q;};
    if(goal&&topicSubject(goal)==="math"&&Math.random()<0.5){
      for(let tries=0;tries<8;tries++){const q=genMath(lvl);if(q.topic===goal&&!isDupe(q))return remember(q)}
    }
    let q=genMath(lvl);
    for(let tries=0;tries<10&&isDupe(q);tries++)q=genMath(lvl);
    return remember(q);
  }
  let pool=BANK[subject][lvl].slice();
  const goal=P&&P.weeklyGoal.topic;
  if(goal&&Math.random()<0.5){
    const gp=pool.filter(q=>q.topic===goal);
    if(gp.length)pool=gp;
  }
  // prefer least-recently asked
  pool.sort((x,y)=>{
    const ix="b_"+subject+lvl+"_"+BANK[subject][lvl].indexOf(x), iy="b_"+subject+lvl+"_"+BANK[subject][lvl].indexOf(y);
    return (P.askedAt[ix]||0)-(P.askedAt[iy]||0)||Math.random()-0.5;
  });
  /* Never serve the same question twice in a row: sorting alone is
     deterministic, so the staleset head repeats whenever a session revisits a
     subject. Pick at random from the 5 stalest instead, and skip anything
     asked in the last 24h while unseen questions remain. */
  const DAY=86400000, now=Date.now();
  const idOf=q=>"b_"+subject+lvl+"_"+BANK[subject][lvl].indexOf(q);
  const fresh=pool.filter(q=>!(P.askedAt[idOf(q)]));
  const notRecent=pool.filter(q=>(now-(P.askedAt[idOf(q)]||0))>DAY);
  const candidates=fresh.length?fresh:(notRecent.length?notRecent:pool);
  const head=candidates.slice(0,Math.min(5,candidates.length));
  let chosen=head[rnd(head.length)];
  if(head.length>1&&P._lastQid&&idOf(chosen)===P._lastQid){
    chosen=head[(head.indexOf(chosen)+1)%head.length];
  }
  const q=Object.assign({},chosen);
  q.id=idOf(chosen);
  P.askedAt[q.id]=Date.now();
  P._lastQid=q.id;
  q.subject=subject;q.level=lvl;
  return q;
}
/* build one question for a specific topic (used by opening review #6) */
function questionForTopic(topic){
  const subj=topicSubject(topic);
  const lvl=Math.max(1,Math.min(5,(P&&P.levels[subj])||1));
  if(subj==="math"){
    if(topic==="word problems")return genWordProblem();
    for(let i=0;i<12;i++){const q=genMath(lvl);if(q.topic===topic)return q;}
    return genMath(lvl);
  }
  const bank=BANK[subj]&&BANK[subj][lvl]?BANK[subj][lvl]:null;
  if(!bank)return null;
  let pool=bank.filter(q=>q.topic===topic);
  if(!pool.length)pool=lessonQuestions(subj).filter(q=>q.topic===topic); // lesson topics live in lessons.js
  const src=pool.length?pool:bank;
  const q=Object.assign({},pick(src));
  q.subject=subj;q.level=lvl;
  return q;
}
/* every practice question from the learner's grade lessons (or all grades), tagged with subject + level */
function lessonQuestions(subject,grade){
  const grades=grade&&LESSONS[grade]?[grade]:Object.keys(LESSONS);
  const out=[];
  grades.forEach(g=>LESSONS[g].forEach(L=>{if(subject&&L.subject!==subject)return;L.qs.forEach(q=>out.push(Object.assign({},q,{subject:L.subject,level:L.lvl,lesson:L.id})))}));
  return out;
}
/* 2–3 warm-up questions from previously-seen (due) topics; intervention topics first;
   decoding/spelling capped to at most 1 (#6, #13) */
function buildReview(subject){
  if(!P)return[];
  const due=topicsDue();
  if(!due.length)return[];
  const PRIORITY=["word problems","comprehension","story structure","inference"];
  const ordered=due.slice().sort((a,b)=>{
    const pa=PRIORITY.indexOf(a),pb=PRIORITY.indexOf(b);
    return (pa<0?9:pa)-(pb<0?9:pb)||Math.random()-0.5;
  });
  const out=[];let englishUsed=0;
  for(const t of ordered){
    if(out.length>=3)break;
    if(topicSubject(t)==="english"){if(englishUsed>=1)continue;englishUsed++;}
    const q=questionForTopic(t);
    if(q){q.review=true;out.push(q);}
  }
  return out.slice(0,3);
}

/* ---------- SM2 spaced repetition ---------- */
// Priority intervention topics: keep them coming back often — cap the interval (#6).
// (Core SM-2 formula is untouched; we only clamp the resulting interval.)
const SM2_CAP={"word problems":3,"comprehension":3,"story structure":3,"inference":4};
function sm2Update(topic,quality){ // quality 0-5
  if(!P)return;
  const s=P.sm2[topic]||{ef:2.5,int:0,reps:0,due:today(),right:0,wrong:0};
  if(quality>=3){
    s.int=s.reps===0?1:(s.reps===1?6:Math.round(s.int*s.ef));
    s.reps++;s.right++;
  }else{
    s.reps=0;s.int=1;s.wrong++;
  }
  s.ef=Math.max(1.3,s.ef+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
  if(SM2_CAP[topic]&&s.int>SM2_CAP[topic])s.int=SM2_CAP[topic]; // interval cap for intervention topics
  s.due=addDays(today(),s.int);
  P.sm2[topic]=s;
}
function topicsDue(){
  if(!P)return[];
  const t=today();
  return Object.entries(P.sm2).filter(([k,v])=>v.due<=t).map(([k])=>k);
}

/* ---------- session ---------- */
function startSession(subject){
  S={subject,total:10,n:0,correct:0,results:[],consecR:0,consecW:0,
     sprintEnd:Date.now()+10*60*1000,qStart:0,cur:null,brokeAt:new Set(),xp:0,mode:"session",
     start:Date.now(),wpC:0,wpT:0,recallC:0,recallT:0,reviewC:0,reviewT:0,mfC:0,mfT:0,wpServed:false,phase:"main",seen:[],diff:0,tried:false};
  // #6: open with 2–3 review questions from earlier sessions
  const review=buildReview(subject);
  if(review.length){
    S.reviewQ=review;S.reviewIdx=0;S.phase="review";S.total=10+review.length;
    say("First, a quick warm-up from what we learned before. Then we play "+SUBJECTS[subject].name+"!");
    nextQuestion();
    return;
  }
  if(subject==="comprehension"){
    say("Story time! Read carefully, then I will quiz you like a detective.");
    showStory();
    return;
  }
  if(subject==="history")sfx("drum");
  say("Let's play "+SUBJECTS[subject].name+"! Take your time and think it through.");
  nextQuestion();
}
// regenerate a question until it isn't one we've shown recently this session (no repeats)
function freshQuestion(genFn){
  let q=genFn(),tries=0;
  while(q&&q.q&&S&&S.seen&&S.seen.includes(q.q)&&tries<14){q=genFn();tries++;}
  return q;
}
function nextQuestion(){
  if(S.n>=S.total)return endSession();
  if(S.lesson){ // grade lesson: fixed question list, in order
    if(!S.lessonQs||S.n>=S.lessonQs.length)return endSession();
    S.cur=S.lessonQs[S.n];renderQuestion();return;
  }
  // #6: serve opening warm-up review questions first
  if(S.phase==="review"){
    if(S.reviewQ&&S.reviewIdx<S.reviewQ.length){
      S.cur=S.reviewQ[S.reviewIdx];S.reviewIdx++;renderQuestion();return;
    }
    S.phase="main";
    if(S.subject==="comprehension"){showStory();return;}
  }
  if(S.subject==="comprehension"){
    if(S.storyQs&&S.storyIdx<S.storyQs.length){
      const q=Object.assign({},S.storyQs[S.storyIdx]);S.storyIdx++;
      q.level=S.storyLvl;q.subject="comprehension";
      S.cur=q;renderQuestion();return;
    }
    return showStory();
  }
  // dynamic difficulty: base mastery level ± the per-answer adjustment (harder after right, easier after wrong)
  const lvl=Math.max(1,Math.min(5,(P.levels[S.subject]||1)+(S.diff||0)));
  // #1: guarantee at least one word problem every math session (single-step first)
  if(S.subject==="math"&&!S.wpServed&&S.phase!=="review"&&(S.n>=2||S.n>=S.total-1)){
    S.wpServed=true;
    S.cur=freshQuestion(genWordProblem);
    renderQuestion();return;
  }
  S.cur=freshQuestion(()=>getQuestion(S.subject,lvl));
  renderQuestion();
}

  S.qStart=Date.now();

  sessSave();                  // auto-save: reopening resumes exactly here
  if(showScratch)initScratch();
  say(q.q+(gate?". Use your scratchpad to work it out first, then show your choices.":""));
}
/* Always-available forward path: skipping counts as a "needs practice" miss
   (first attempt only) so the adaptive engine still learns from it. */
function skipQuestion(){
  const q=S.cur;if(!q)return;
  if(!S.tried){
    S.tried=true;
    S.results.push({topic:q.topic,correct:false,level:q.level,ms:Date.now()-S.qStart});
    if(S.phase==="review")S.reviewT++;
    if(isWordProblem(q))S.wpT++;
    if(isRecall(q)||S.subject==="comprehension")S.recallT++;
    if(isMathFacts(q))S.mfT++;
    sm2Update(q.topic,2);
    S.consecR=0;S.diff=Math.max(-2,(S.diff||0)-1);
    P.wrongLog.push({date:today(),topic:q.topic,subject:S.subject});
    save();
  }
  S.n++;sessSave();
  sfx("tick");
  nextQuestion();
}

function manipCoin(v){_mtot+=v;_mcount++;const m=$("mmat");if(m)m.insertAdjacentHTML("beforeend",'<span class="token coin sm">'+v+'¢</span>');const t=$("mtotal");if(t)t.textContent=_mtot;sfx("tick");}
function manipCounter(d){_mcount=Math.max(0,_mcount+d);const m=$("mmat");if(m){if(d>0)m.insertAdjacentHTML("beforeend",'<span class="token sm">🏀</span>');else if(m.lastChild)m.removeChild(m.lastChild);}const t=$("mtotal");if(t)t.textContent=_mcount;sfx("tick");}

/* ---------- scratchpad (#4) ---------- */
function scratchHTML(){
  return '<div class="scratch"><div class="sc-top"><span>✏️ Scratchpad — work it out here</span>'
    +'<button class="sc-btn" onclick="scratchClear()">↺ Clear</button></div>'
    +'<canvas id="scpad" width="600" height="180"></canvas></div>';
}
let _scctx=null,_scdraw=false;
function initScratch(){
  const c=$("scpad");if(!c||!c.getContext)return;
  _mtot=0;_mcount=0;
  const ctx=c.getContext("2d");_scctx=ctx;
  ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle="#1B4332";
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const down=e=>{_scdraw=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!_scdraw)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const up=()=>{_scdraw=false;};
  c.addEventListener("pointerdown",down);c.addEventListener("pointermove",move);
  c.addEventListener("pointerup",up);c.addEventListener("pointerleave",up);
}
function scratchClear(){const c=$("scpad");if(c&&c.getContext)c.getContext("2d").clearRect(0,0,c.width,c.height);}
function answer(pos){
  const q=S.cur;
  let leveledUp=false;
  const elapsed=Date.now()-S.qStart;
  const chosen=S.order[pos];
  const correct=chosen===q.a;
  const firstTry=!S.tried;
  if(correct){
    // lock everything, light up the right answer
    S.order.forEach((oi,p)=>{
      const b=$("opt"+p);if(!b)return;
      if(oi===q.a)b.classList.add("correct");else b.classList.add("dim");
      b.onclick=null;
    });
  }else{
    // MASTERY MODE: this choice retires; the others stay live so they retry until correct
    const b=$("opt"+pos);
    if(b){b.classList.add("wrong");b.onclick=null;setTimeout(()=>{b.classList.add("dim")},650);}
  }
  // record stats/difficulty ONLY on the first attempt — retries never double-count
  if(firstTry){
    S.tried=true;
    S.results.push({topic:q.topic,correct,level:q.level,ms:elapsed});
    if(S.phase==="review"){S.reviewT++;if(correct)S.reviewC++;}
    if(isWordProblem(q)){S.wpT++;if(correct)S.wpC++;}
    if(isRecall(q)||S.subject==="comprehension"){S.recallT++;if(correct)S.recallC++;}
    if(isMathFacts(q)){S.mfT++;if(correct)S.mfC++;}
    sm2Update(q.topic,correct?(elapsed<15000?5:4):2);
    if(correct){
      S.correct++;S.consecR++;S.consecW=0;
      S.diff=Math.min(2,(S.diff||0)+1);      // ⬆ next question comes in harder
      S.xp+=10*q.level;P.xp+=10*q.level;
      P.streak++;if(P.streak>P.bestStreak)P.bestStreak=P.streak;
      checkStreakTrophy();
      growStats(q,true);
      if(S.consecR>=2){if(P.levels[S.subject]<5){P.levels[S.subject]++;leveledUp=true;S.diff=0}S.consecR=0}
    }else{
      S.consecW++;S.consecR=0;P.streak=0;
      S.diff=Math.max(-2,(S.diff||0)-1);     // ⬇ next question comes in easier
      P.wrongLog.push({date:today(),topic:q.topic,subject:S.subject});
      growStats(q,false);
      if(S.consecW>=2){if(P.levels[S.subject]>1){P.levels[S.subject]--;toast("Let's build it back up — Level "+P.levels[S.subject])}S.consecW=0}
    }
    save();sessSave();
  }
  if(correct){
    S.n++;
    save();sessSave();
    sfx("correct");
    if(P.streak>0&&P.streak%5===0)confetti();
    if(leveledUp){
      say("Level up!");
      setTimeout(()=>{
        heroMoment({title:"LEVEL UP!",sub:LEVEL_NAMES[P.levels[S.subject]]+" unlocked!",mood:"party",sound:"levelup",hold:2800});
        setTimeout(()=>{closeOverlay();nextQuestion();},2900);
      },750);
    }else{
      // reward + a clear, prominent NEXT — advancing happens on the child's tap
      const w=$("optwrap");
      const tb=$("trybar");if(tb)tb.remove();
      const sb=$("skipbar");if(sb)sb.remove();
      if(w&&!$("nextbar")){
        w.insertAdjacentHTML("afterend",
          '<div class="center fadein" id="nextbar" style="margin-top:16px">'
          +'<div class="hero-chip" style="font-size:16px">🎯 '+esc(pick(CORRECT_PRAISE))+'</div>'
          +'<div class="spacer" style="height:10px"></div>'
          +'<button class="btn big" onclick="nextQuestion()">'+(S.n>=S.total?"Finish! 🏁":"Next ▶")+'</button></div>');
      }else if(!w){setTimeout(()=>{nextQuestion();},1200);} // safety net: never dead-end
    }
  }else{
    sfx("wrong");
    const enc=pick(TRY_AGAIN);
    say(enc);
    const w=$("optwrap");
    const tb=$("trybar");if(tb)tb.remove();
    if(w){
      w.insertAdjacentHTML("afterend",
        '<div class="center fadein" id="trybar" style="margin-top:14px">'
        +'<div class="speech" style="display:inline-block;margin-top:0">'+esc(enc)+' Pick another answer!</div>'
        +(q.teach?'<div class="spacer" style="height:10px"></div><button class="btn secondary" onclick="askHelp()">💡 Hint — Ananse, teach me</button>':'')
        +'</div>');
    }
  }
}
/* ---------- 2K stat growth hooks (#9) ---------- */
function isMathFacts(q){
  if(!q||!S)return false;
  const t=(q.topic||"").toLowerCase();
  return S.subject==="math"&&/addition|subtraction|multiplication|division|place value|order of operations|rounding|times table|number/.test(t)&&!/word problem/.test(t);
}
function isWordProblem(q){return q&&/word problem/i.test(q.topic||"")}
function isRecall(q){return q&&/recall|sequence|comprehension|story/i.test(q.topic||"")}
function growStats(q,correct){
  if(!P.stats)P.stats={speed:90,reading:80,memory:72,strategy:42,recall:38};
  const st=P.stats, clamp=k=>{if(st[k]>99)st[k]=99;if(st[k]<1)st[k]=1};
  const before={strategy:st.strategy,recall:st.recall};
  if(correct){
    if(isWordProblem(q)){st.strategy+=2;clamp("strategy")}
    if(isRecall(q)||S.subject==="comprehension"){st.recall+=2;clamp("recall")}
    if(S.subject==="english"){st.reading+=1;clamp("reading")}
    if(/sequence|memory|inference/i.test(q.topic||"")){st.memory+=1;clamp("memory")}
    if(isMathFacts(q)&&(Date.now()-S.qStart)<6000){st.speed+=1;clamp("speed")}
    // celebrate when an intervention stat crosses a 10-point milestone (#16)
    ["strategy","recall"].forEach(k=>{
      if(Math.floor(st[k]/10)>Math.floor(before[k]/10)&&typeof fireCelebration==="function")
        fireCelebration("milestone",k.toUpperCase()+" "+(Math.floor(st[k]/10)*10));
    });
  }
}

/* ---------- speed monitor ---------- */
function showStopSign(){

/* ---------- Ananse teaching mode ---------- */
let T=null; // teaching state
function startTeaching(praise){
  T={q:S.cur,step:0,from:"session",praise:praise||""};
  renderTeachStep();
}
/* student-requested help: walk the hints, then return to the same question to answer */
function askHelp(){
  if(!S||!S.cur||!S.cur.teach)return;
  if(typeof sfx==="function")sfx("tick");
  T={q:S.cur,step:0,from:"help",praise:"Sure! Let's work through it together."};
  renderTeachStep();
}
function renderTeachStep(){
  const steps=T.q.teach;
  const st=steps[T.step];
  // #3: accumulated checkmarks for completed steps, one instruction visible at a time
  const done=steps.slice(0,T.step).map((s,i)=>'<div class="micro-confirm">✅ <span>'+esc(s.t)+'</span></div>').join("");
  openOverlay('<div class="center">'
   +'<div class="ananse-wrap">'+ananseSVG(110,"teach")+'</div>'
   +(T.step===0&&T.praise?'<div class="speech" style="margin-bottom:8px">'+esc(T.praise)+'</div>':"")
   +(done?'<div class="microlist">'+done+'</div>':"")
   +'<div class="micro-now"><div class="teach-illus">'+st.i+'</div>'
   +'<p class="teach-text">Step '+(T.step+1)+' of '+steps.length+': '+esc(st.t)+'</p></div>'
   +'<div class="step-dots">'+steps.map((_,i)=>'<span class="dot '+(i<=T.step?"on":"")+'"></span>').join("")+'</div>'
   +'<button class="btn big" onclick="teachNext()">'+(T.step<steps.length-1?"I did this ✓ — next step":"Got it! Let me try one 💪")+'</button>'
   +'</div>');
  say(st.t);
}
function teachNext(){
  if(T.step<T.q.teach.length-1){T.step++;renderTeachStep()}
  else if(T.from==="help"){closeOverlay();if(typeof say==="function")say("Now you try. Pick your answer when you're ready.");}
  else renderPractice();
}
function renderPractice(){
  const pr=T.q.practice;
  if(!pr){closeOverlay();nextQuestion();return}
  const order=shuffle(pr.opts.map((_,i)=>i));
  T.order=order;
  const letters=["A","B","C","D"];
  openOverlay('<div>'
   +'<div class="center"><div class="ananse-wrap">'+ananseSVG(90,"teach")+'</div>'
   +'<div class="speech">Your turn! Try this one with me.</div></div>'
   +'<div class="spacer"></div>'
   +'<p class="qtext" style="font-size:23px">'+esc(pr.q)+'</p>'
   +'<div class="opts">'+order.map((oi,pos)=>'<button class="opt" id="popt'+pos+'" onclick="answerPractice('+pos+')"><span class="letter">'+letters[pos]+'</span><span>'+esc(pr.opts[oi])+'</span></button>').join("")+'</div>'
   +'</div>');
  say("Your turn! "+pr.q);
}
function answerPractice(pos){
  const pr=T.q.practice;
  const chosen=T.order[pos];
  const correct=chosen===pr.a;
  T.order.forEach((oi,p)=>{
    const b=$("popt"+p);if(!b)return;
    if(oi===pr.a)b.classList.add("correct");
    else if(p===pos&&!correct)b.classList.add("wrong");
    else b.classList.add("dim");
    b.onclick=null;
  });
  if(correct&&S){S.xp+=5;P.xp+=5;save()}
  const praise=pick(PRAISE);
  const msg=correct?"You got it! See — your brain was growing the whole time.":"So close! The answer was \""+pr.opts[pr.a]+"\". You worked through every step, and that is what matters.";
  setTimeout(()=>{
    openOverlay('<div class="center"><div class="ananse-wrap">'+ananseSVG(110,correct?"party":"teach")+'</div><div class="speech">'+esc(msg)+'</div><p class="muted" style="margin-top:10px">'+esc(praise)+'</p><div class="spacer"></div><button class="btn big" onclick="closeOverlay();afterTeaching()">Keep going ▶</button></div>');
    say(msg+" "+praise);
  },1200);
}
function afterTeaching(){
  if(T&&T.from==="daily"){finishDaily(false);return}
  if(T&&T.from==="diag"){diagNext();return}
  nextQuestion();
}

/* ---------- session end ---------- */
function endSession(){
  clearTimers();closeOverlay();defocus();sessClear();
  const acc=S.results.length?S.correct/S.results.length:0;
  const lvlAvg=S.results.length?S.results.reduce((a,r)=>a+r.level,0)/S.results.length:1;
  const durMs=Date.now()-(S.start||(S.sprintEnd-10*60*1000));

    durMs:durMs,wpC:S.wpC,wpT:S.wpT,recallC:S.recallC,recallT:S.recallT,reviewC:S.reviewC,reviewT:S.reviewT,mfC:S.mfC,mfT:S.mfT,lesson:S.lesson||null});
  if(S.lesson&&S.lesson.indexOf("reveal:")===0){const rid=S.lesson.slice(7);P.reveal=P.reveal||{};const prev=P.reveal[rid];const best=Math.max(prev?prev.best:0,S.correct);P.reveal[rid]={date:today(),best,total:S.results.length,tries:(prev?prev.tries:0)+1};}
  else if(S.lesson){P.lessons=P.lessons||{};const prev=P.lessons[S.lesson];const rec={date:today(),correct:S.correct,total:S.results.length,tries:(prev?prev.tries:0)+1};if(!prev||rec.correct>=prev.correct)P.lessons[S.lesson]=rec;else{prev.tries=rec.tries;prev.date=rec.date;}}
  if(typeof checkAlerts==="function")checkAlerts();
  const earned=[];

  if(acc>=0.8&&S.results.length>=S.total){

function startHoops(){

  app.innerHTML='<div class="fadein center" style="max-width:480px;margin:0 auto">'
   +'<h1>🏀 Bonus Hoops!</h1>'

function hoopRun(){
  if(hoopInt)clearInterval(hoopInt);
  H.pos=0;H.dir=1;H.live=true;
  hoopInt=setInterval(()=>{
    H.pos+=H.dir*3.4;
    if(H.pos>=100){H.pos=100;H.dir=-1}
    if(H.pos<=0){H.pos=0;H.dir=1}
    const m=$("hoopMark");if(m)m.style.left="calc("+H.pos+"% - 7px)";
  },16);
}
function hoopsShoot(){
  if(!H||!H.live)return;
  H.live=false;
  if(hoopInt){clearInterval(hoopInt);hoopInt=null}
  const hit=H.pos>=38&&H.pos<=62;
  H.shot++;
  if(hit){H.made++;P.xp+=3;save()}
  const an=$("hoopAnim");if(an)an.innerHTML=hit?'🏀➡️🧺 <b style="color:#3bb273">SWISH!</b>':'🏀↩️ <b style="color:#ff6b4a">Rim out!</b>';
  const sc=$("hoopScore");if(sc)sc.textContent="Shot "+Math.min(H.shot+1,5)+" of 5 · Made "+H.made;
  say(hit?"Swish!":"So close!");
  if(H.shot>=5)setTimeout(endHoops,1200);
  else setTimeout(()=>{if(!H)return;const a2=$("hoopAnim");if(a2)a2.innerHTML="🏀&nbsp;&nbsp;&nbsp;&nbsp;🧺";hoopRun()},900);
}
function endHoops(){
  if(hoopInt){clearInterval(hoopInt);hoopInt=null}
  if(!H)return;
  const made=H.made,shots=H.shot;
  H=null;
  if(made===5){
    awardTrophy({type:"hoops",icon:"🏀",label:"Sharpshooter",color:"#f5a623",detail:"Made 5 of 5 bonus free throws!"});

  app.innerHTML='<div class="fadein center">'

   +'<div class="speech" style="max-width:420px;margin:14px auto">You made '+made+' of '+shots+' free throws'+(made?' and earned +'+(made*3)+' XP':'')+'. '+(made===5?'A Sharpshooter trophy is waiting in your trophy room!':'Keep practicing — your aim grows just like your brain!')+'</div>'
   +'<div class="spacer"></div><div class="btn-row"><button class="btn big" onclick="goHome()">Daily Path 🏠</button>'
   +(made===5?'<button class="btn secondary big" onclick="renderTrophyRoom()">Trophy Room 🏆</button>':"")
   +'</div></div>';
  say("You made "+made+" of "+shots+"! Great bonus game.");
}

   +'<div class="center"><div class="spacer"></div><div class="btn-row">'
   +'<button class="btn big" onclick="replayStart()">I read it — Quiz me! ✅</button>'
   +'<button class="readbtn" onclick="say(R.sq.text)">🔊 Read it to me</button></div></div>';
  say("Story Replay! Here is the story: "+sq.title+". "+sq.text);
}
function replayStart(){ambientStop();R.qi=0;R.correct=0;R.total=0;replayQuestion();}
function replayQuestion(){
  defocus();if(typeof document!=="undefined"&&document.body)document.body.classList.add("focus");
  const ev=R.events,i=R.qi;
  if(i>=ev.length)return replayDone();
  // q0: what happened FIRST; later: what happened NEXT after previous event
  const correctText=ev[i];
  const distractors=ev.filter((_,k)=>k!==i);
  const opts=shuffle([correctText].concat(distractors.slice(0,3))).slice(0,Math.min(4,ev.length));
  if(!opts.includes(correctText))opts[0]=correctText;
  R.order=opts;R.ans=opts.indexOf(correctText);
  const letters=["A","B","C","D"];
  const prompt=i===0?"What happened FIRST in the story?":"What happened NEXT, after “"+ev[i-1]+"”?";
  app.innerHTML='<div class="fadein focus-wrap">'
   +'<div class="hud"><span class="pill">🎬 <b>Story Replay</b></span>'
   +'<span class="lvl-badge">Step '+(i+1)+' of '+ev.length+'</span></div>'
   +'<div class="card gold"><p class="qtext">'+esc(prompt)+'</p>'
   +'<div class="center" style="margin:-4px 0 10px"><button class="readbtn" onclick="say(R.sq.text)">🔊 Hear the story again</button></div>'
   +'<div class="opts">'+opts.map((o,pos)=>'<button class="opt" id="ropt'+pos+'" onclick="replayAnswer('+pos+')"><span class="letter">'+letters[pos]+'</span><span>'+esc(o)+'</span></button>').join("")+'</div>'
   +'</div></div>';
  say(prompt);
}
function replayAnswer(pos){
  const correct=pos===R.ans;
  R.order.forEach((o,p)=>{const b=$("ropt"+p);if(!b)return;if(p===R.ans)b.classList.add("correct");else if(p===pos&&!correct)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null;});
  R.total++;
  // count toward recall metric + stat growth
  if(correct){
    R.correct++;P.streak++;if(P.streak>P.bestStreak)P.bestStreak=P.streak;
    if(!P.stats)P.stats={speed:90,reading:80,memory:72,strategy:42,recall:38};
    P.stats.recall=Math.min(99,P.stats.recall+2);P.stats.memory=Math.min(99,P.stats.memory+1);
    R.consec=(R.consec||0)+1;
    sfx("correct");save();
    if(R.consec>=3&&typeof fireCelebration==="function")fireCelebration("recall3");
  }else{R.consec=0;P.streak=0;sfx("wrong");save();}
  const msg=correct?"Yes! That is exactly the right order.":"Good try! The right one was “"+R.events[R.qi]+"”.";
  setTimeout(()=>{
    openOverlay('<div class="center"><div class="ananse-wrap">'+ananseSVG(110,correct?"party":"teach")+'</div><div class="speech">'+esc(msg)+'</div><div class="spacer"></div><button class="btn big" onclick="closeOverlay();replayNext()">Next ▶</button></div>');
    say(msg);
  },700);
}
function replayNext(){R.qi++;replayQuestion();}
function replayDone(){
  defocus();ambientStop();
  // log a lightweight session for tracking
  P.sessions.push({date:today(),subject:"comprehension",correct:R.correct,total:R.total,lvlAvg:1,xp:R.correct*8,t:Date.now(),
    durMs:0,wpC:0,wpT:0,recallC:R.correct,recallT:R.total,reviewC:0,reviewT:0,mfC:0,mfT:0,replay:true});
  if(R.correct===R.total&&R.total>=3){awardTrophy({type:"recall",icon:"🎬",label:"Replay Master",color:"#3bb273",detail:"Perfect story order — "+R.correct+"/"+R.total+"!"});}
  save();
  if(typeof checkAlerts==="function")checkAlerts();
  confetti();
  app.innerHTML='<div class="fadein center">'
   +'<div class="ananse-wrap ananse-celebrate">'+ananseSVG(150,"party")+'</div>'
   +'<h1>Replay Complete!</h1>'
   +'<div class="speech" style="max-width:460px;margin:14px auto">You put the story in order — '+R.correct+' out of '+R.total+' correct. Remembering order makes your RECALL stat grow!</div>'
   +'<div class="center"><div class="spacer"></div><div class="btn-row">'
   +'<button class="btn big" onclick="startStoryReplay()">Another story 🎬</button>'
   +'<button class="btn secondary" onclick="goHome()">🏠 Home</button></div></div></div>';
  say("Great job! You got "+R.correct+" out of "+R.total+" in the right order.");
}

/* ============================================================
   SPOT THE PATTERN mini-game (#14) — 3 items max per round
   Jersey-number skip counts + Kente colour repeats.
   ============================================================ */
const KENTE_COLORS={gold:"#C9A84C",green:"#1B4332",red:"#c0492f",black:"#1a1a1a",blue:"#2a5fa8"};
let G=null;
function makePattern(){
  if(Math.random()<0.5){
    // numeric skip-count jersey numbers
    const step=pick([2,3,5,10]);const start=pick([0,1,2,3,4])+step;
    const seq=[start,start+step,start+step*2,start+step*3];
    const ans=start+step*4;
    const opts=shuffle([ans,ans+step,ans-step,ans+1]).slice(0,4);
    if(!opts.includes(ans))opts[0]=ans;
    return{kind:"num",seq:seq,ans:String(ans),opts:opts.map(String),
      prompt:"What jersey number comes NEXT?",hint:"The numbers go up by "+step+" each time."};
  }else{
    // kente colour repeat
    const cols=Object.keys(KENTE_COLORS);
    const a=pick(cols);let b=pick(cols);while(b===a)b=pick(cols);
    const unit=[a,b];const seq=[a,b,a,b,a]; // next should be b
    const ans="b"; const optCols=shuffle([a,b,pick(cols.filter(c=>c!==a&&c!==b))]);
    return{kind:"col",seq:seq,ansCol:b,opts:optCols,
      prompt:"Which colour comes NEXT in the Kente pattern?",hint:"The pattern repeats: "+a+", "+b+", "+a+", "+b+"…"};
  }
}
function startPatterns(){
  clearTimers();closeOverlay();defocus();showAnanseCorner(false);
  G={i:0,n:3,correct:0};
  say("Spot the Pattern! Look closely and find what comes next.");
  patternRound();
}
function swatchHTML(col){return '<span class="swatch" style="background:'+(KENTE_COLORS[col]||"#ccc")+'"></span>';}
function patternRound(){
  if(typeof document!=="undefined"&&document.body)document.body.classList.add("focus");
  if(G.i>=G.n)return patternDone();
  const p=makePattern();G.cur=p;
  const letters=["A","B","C","D"];
  let cells,optsHTML,ansIdx;
  if(p.kind==="num"){
    cells=p.seq.map(n=>'<span class="pat-cell">'+n+'</span>').join("")+'<span class="pat-cell q">?</span>';
    const order=shuffle(p.opts.map((_,i)=>i));G.order=order;ansIdx=p.opts.indexOf(p.ans);
    optsHTML=order.map((oi,pos)=>'<button class="opt" id="gopt'+pos+'" onclick="patternAnswer('+pos+')"><span class="letter">'+letters[pos]+'</span><span>'+esc(p.opts[oi])+'</span></button>').join("");
    G.ans=order.indexOf(ansIdx);
  }else{
    cells=p.seq.map(c=>'<span class="pat-cell">'+swatchHTML(c)+'</span>').join("")+'<span class="pat-cell q">?</span>';
    const order=shuffle(p.opts.map((_,i)=>i));G.order=order;ansIdx=p.opts.indexOf(p.ansCol);
    optsHTML=order.map((oi,pos)=>'<button class="opt" id="gopt'+pos+'" onclick="patternAnswer('+pos+')"><span class="letter">'+letters[pos]+'</span>'+swatchHTML(p.opts[oi])+'<span>'+esc(p.opts[oi])+'</span></button>').join("");
    G.ans=order.indexOf(ansIdx);
  }
  app.innerHTML='<div class="fadein focus-wrap">'
   +'<div class="hud"><span class="pill">🧩 <b>Spot the Pattern</b></span><span class="lvl-badge">'+(G.i+1)+' of '+G.n+'</span></div>'
   +'<div class="card gold"><p class="qtext">'+esc(p.prompt)+'</p>'
   +'<div class="pat-row">'+cells+'</div>'
   +'<div class="opts">'+optsHTML+'</div></div></div>';
  say(p.prompt);
}
function patternAnswer(pos){
  const correct=pos===G.ans;
  G.order.forEach((o,p)=>{const b=$("gopt"+p);if(!b)return;if(p===G.ans)b.classList.add("correct");else if(p===pos&&!correct)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null;});
  if(correct){G.correct++;P.stats.memory=Math.min(99,(P.stats.memory||72)+1);sfx("correct");}else sfx("wrong");
  save();
  const msg=correct?"Nice eyes! That is the pattern.":"Almost! "+G.cur.hint;
  setTimeout(()=>{openOverlay('<div class="center"><div class="ananse-wrap">'+ananseSVG(100,correct?"party":"teach")+'</div><div class="speech">'+esc(msg)+'</div><div class="spacer"></div><button class="btn big" onclick="closeOverlay();patternNext()">Next ▶</button></div>');say(msg);},600);
}
function patternNext(){G.i++;patternRound();}
function patternDone(){
  defocus();confetti();
  app.innerHTML='<div class="fadein center">'
   +'<div class="ananse-wrap ananse-celebrate">'+ananseSVG(140,"party")+'</div>'
   +'<h1>Pattern Pro!</h1>'
   +'<div class="speech" style="max-width:440px;margin:14px auto">You spotted '+G.correct+' of '+G.n+' patterns. Pattern-spotting trains your brain to see how things connect!</div>'
   +'<div class="center"><div class="spacer"></div><div class="btn-row">'
   +'<button class="btn big" onclick="startPatterns()">Again 🧩</button>'
   +'<button class="btn secondary" onclick="goHome()">🏠 Home</button></div></div></div>';
  say("You found "+G.correct+" patterns. Great pattern power!");
}

{q:"'His passes found teammates like water finding a path downhill.' What does this simile mean?",opts:["His passes flowed smoothly and always arrived","He threw the ball into water","His passes were slow","He only passed downhill"],a:0,topic:"figurative language",teach:[{i:"🎭",t:"A simile compares two things with 'like'. Picture water flowing downhill."},{i:"💧",t:"Water always finds its way down — smooth, natural, unstoppable."},{i:"🎯",t:"His passes flowed naturally to teammates, never getting stuck."}]},
{q:"What does the nickname 'the engine no one saw' mean?",opts:["Fiifi powered the team without getting noticed","Fiifi drove the team bus","Fiifi hid during the game","Fiifi was invisible"],a:0,topic:"figurative language",teach:[{i:"🎭",t:"An engine makes a car move, but you never see it from outside."},{i:"⚙️",t:"Fiifi scored zero points, yet EVERY basket started with his pass."},{i:"🎯",t:"He powered the whole team while nobody was watching him."}]},
{q:"What happened right after the coach's announcement?",opts:["The tall players grumbled","The Tigers won","Fiifi scored a point","The newspaper arrived"],a:0,topic:"story structure",teach:[{i:"🎬",t:"Find the announcement, then read the very next sentence."},{i:"📖",t:"'Fiifi will start tonight,' he announced. 'The tall players grumbled.'"},{i:"🎯",t:"The grumbling came right after."}]},
{q:"What is the main idea of this story?",opts:["A player's value isn't always in the points they score","Tall players are always better","Newspapers love basketball","Losing five games means you should quit"],a:0,topic:"comprehension",teach:[{i:"💡",t:"Look at the twist: zero points, yet the team won because of him."},{i:"🤝",t:"The story celebrates unselfish play and hidden contributions."},{i:"🎯",t:"Value isn't only scoring — helping the team counts just as much."}]}
]},
{title:"Grandfather's Drum",text:"When Grandfather was a boy in Kumasi, he carved a drum from a fallen cedar tree. He played it at festivals for fifty years, until his hands grew tired. Last month, he placed the drum in my arms. 'It is not a gift,' he said. 'It is a promise.' At first I did not understand. But as I practiced each evening, neighbors began to gather outside our window, clapping and singing like they once did for him. Now I know what I promised: to keep the music alive.",qs:[
{q:"What did Grandfather mean by 'It is not a gift. It is a promise'?",opts:["The drum came with a duty to continue the tradition","He wanted the drum back","The drum was broken","He never liked the drum"],a:0,topic:"inference",teach:[{i:"🕵️",t:"A gift is just for you. A promise asks something OF you."},{i:"🪘",t:"The narrator later says: 'Now I know what I promised: to keep the music alive.'"},{i:"🎯",t:"The drum carried a duty — to carry on the family tradition."}]},
{q:"What does 'his hands grew tired' tell us about Grandfather?",opts:["He was getting old","He stopped loving music","He was lazy","He hurt his hands in a game"],a:0,topic:"inference",teach:[{i:"🕵️",t:"After FIFTY years of playing, why would hands grow tired?"},{i:"👴",t:"It's a gentle way of saying he aged and could not play like before."},{i:"🎯",t:"It tells us he was getting old — said kindly."}]},
{q:"Which order is correct?",opts:["Carved drum → played 50 years → gave it away","Gave it away → carved drum → played","Played → carved drum → gave it away","Carved drum → gave it away → played 50 years"],a:0,topic:"story structure",teach:[{i:"🎬",t:"Track Grandfather's life from boy to old man."},{i:"📖",t:"Boy: carved it. Adult: played at festivals 50 years. Last month: passed it on."},{i:"🎯",t:"Carved → played 50 years → gave it away."}]},
{q:"Why did the neighbors gather outside the window?",opts:["The narrator's drumming brought the old joy back","They were angry about noise","They wanted to buy the drum","It was raining"],a:0,topic:"inference",teach:[{i:"🕵️",t:"Look at WHAT they did: clapping and singing."},{i:"🎶",t:"'Like they once did for him' — the music pulled people together again."},{i:"🎯",t:"The drumming brought back the joy they remembered."}]},
{q:"What is this story mostly about?",opts:["Passing a family tradition to a new generation","How to carve a drum","Festivals in Kumasi","A noisy neighborhood"],a:0,topic:"comprehension",teach:[{i:"💡",t:"Think about the beginning and end together."},{i:"🔁",t:"Grandfather's music → the drum → the narrator's promise to keep it alive."},{i:"🎯",t:"It's about passing a tradition from one generation to the next."}]}
]}
],
5:[
{title:"The Night Market Mystery",text:"Every Friday, the night market in Osu glowed with lanterns — until the week the lights began vanishing, one stall at a time. Some traders whispered about ghosts. Nana Yaa, who sold kelewele, was not convinced. She noticed the lights only disappeared on windy nights, and only from the stalls nearest the sea. So on Friday she arrived early, hid behind her stall, and waited. As the sea breeze rose, she watched a loose canvas sheet swing against the lantern hooks, knocking them one by one into a basket below. The 'ghost' was nothing but wind and bad knots. Nana Yaa retied every lantern with a fisherman's knot, and the market never went dark again.",qs:[
{q:"How did Nana Yaa solve the mystery?",opts:["She observed patterns and waited to see the real cause","She asked a ghost to leave","She bought new lanterns","She closed the market"],a:0,topic:"comprehension",teach:[{i:"💡",t:"Trace her steps: notice → predict → watch → fix."},{i:"🔍",t:"She spotted the pattern (windy nights, sea-side stalls), then hid and watched the cause with her own eyes."},{i:"🎯",t:"She solved it by observing carefully — like a scientist."}]},
{q:"Which clue told Nana Yaa it was probably NOT a ghost?",opts:["Lights only vanished on windy nights near the sea","The lanterns were old","The traders were whispering","Kelewele sold out early"],a:0,topic:"inference",teach:[{i:"🕵️",t:"A ghost wouldn't care about weather. But what DOES need wind?"},{i:"🌬️",t:"The pattern — windy nights + sea-side stalls — points to the sea breeze."},{i:"🎯",t:"The wind pattern was the clue that ruled out ghosts."}]},
{q:"Why did Nana Yaa hide behind her stall and wait?",opts:["To see the true cause with her own eyes","To scare the ghost","To take a nap","To steal lanterns"],a:0,topic:"inference",teach:[{i:"🕵️",t:"She had a suspicion — but a good detective confirms it."},{i:"👀",t:"By hiding and watching, she could catch the cause in action."},{i:"🎯",t:"She waited to SEE the real cause — evidence beats guessing."}]},
{q:"What is the correct order of events?",opts:["Lights vanish → traders blame ghosts → Nana Yaa watches → she reties the knots","Nana Yaa reties knots → lights vanish → ghosts arrive","Traders blame ghosts → lights vanish → market closes","Nana Yaa watches → lights vanish → traders celebrate"],a:0,topic:"story structure",teach:[{i:"🎬",t:"Walk through the story from problem to solution."},{i:"📖",t:"Problem (vanishing lights) → wrong idea (ghosts) → investigation → fix (fisherman's knots)."},{i:"🎯",t:"Vanish → blame ghosts → watch → retie. Problem to solution!"}]},
{q:"What lesson does this story teach?",opts:["Look for evidence instead of believing rumors","Ghosts are real","Never sell food at night","Wind is dangerous"],a:0,topic:"comprehension",teach:[{i:"💡",t:"Compare the traders (whispered rumors) with Nana Yaa (gathered evidence)."},{i:"⚖️",t:"Rumors solved nothing. Observation fixed the market for good."},{i:"🎯",t:"The lesson: trust evidence and careful thinking over rumors."}]}
]},
{title:"The Final Buzzer",text:"With the national title on the line, the Accra Lions trailed by two points. Ten seconds remained. Captain Kojo had promised his late father he would bring the trophy home, and that promise weighed on him like a backpack full of stones. The inbound pass found his hands. Two defenders rushed toward him — everyone in the arena knew the plan was for Kojo to shoot. But from the corner of his eye, he saw Serwaa, completely open at the three-point line, waving. A promise, Kojo realized, is not about who takes the shot. He whipped the pass to Serwaa. The buzzer sounded as her shot arced through the night air... and snapped the net. Champions.",qs:[
{q:"'That promise weighed on him like a backpack full of stones.' What does this mean?",opts:["The promise felt like heavy pressure","He carried stones to games","His backpack was lost","He was physically weak"],a:0,topic:"figurative language",teach:[{i:"🎭",t:"A simile compares feelings to things you can touch."},{i:"🎒",t:"Imagine playing while carrying stones — slow, heavy, exhausting. That's pressure."},{i:"🎯",t:"The promise felt like a heavy weight of pressure on him."}]},
{q:"Why did BOTH defenders rush toward Kojo?",opts:["Everyone expected Kojo to take the final shot","They wanted his autograph","Serwaa told them to","They were lost"],a:0,topic:"inference",teach:[{i:"🕵️",t:"The story says 'everyone in the arena knew the plan was for Kojo to shoot.'"},{i:"🛡️",t:"Defenders guard the player they EXPECT to shoot."},{i:"🎯",t:"They rushed Kojo because everyone expected him to shoot — leaving Serwaa open."}]},
{q:"What did Kojo realize about his promise?",opts:["Keeping it meant winning as a team, not shooting himself","He should break it","His father wanted him to score 50","Promises don't matter"],a:0,topic:"comprehension",teach:[{i:"🔍",t:"Find the sentence with 'realized'."},{i:"📖",t:"'A promise, Kojo realized, is not about who takes the shot.'"},{i:"🎯",t:"Bringing the trophy home mattered — not who scored. So he passed."}]},
{q:"What happened at the very END of the story?",opts:["Serwaa's shot won the championship","Kojo took the final shot","The Lions lost by two","The game was cancelled"],a:0,topic:"story structure",teach:[{i:"🎬",t:"Read the final lines once more."},{i:"📖",t:"'Her shot arced through the night air... and snapped the net. Champions.'"},{i:"🎯",t:"Serwaa's three-pointer won it at the buzzer."}]},
{q:"Why was passing the harder — but better — choice for Kojo?",opts:["He gave up his moment of glory so the team could win","Passing is always easy","He was afraid of the ball","The coach forced him"],a:0,topic:"inference",teach:[{i:"🕵️",t:"Think about what Kojo wanted: to keep his promise himself, as the hero."},{i:"🤝",t:"Giving the shot to an open teammate took trust and unselfishness — with the title on the line."},{i:"🎯",t:"He sacrificed personal glory for the team — the harder, wiser choice."}]}
]}
]
};

<script>
"use strict";
/* ============================================================
   DIAGNOSTIC ADVENTURE — first launch only
   ============================================================ */
let D=null;
const DIAG_PER_SUBJECT=4;
const DIAG_ORDER=["math","english","comprehension","science","history"];
/* Entry point. First login: pick a grade, then walk the trail.
   Re-check (parent request): same trail, progress and trophies untouched. */
function startDiagnostic(opts){
  clearTimers();closeOverlay();defocus();showAnanseCorner(false);
  D={retest:!!(opts&&opts.retest),plan:null,si:0,i:0};
  if(!P.grade){pickGradeThen(diagIntro,true);return;}
  diagIntro();
}
/* grade picker — used at onboarding and from the lessons screen */
let _gradeAfter=null;
function pickGradeThen(fn,first){
  _gradeAfter=fn;
  clearTimers();closeOverlay();showAnanseCorner(false);
  app.innerHTML='<div class="fadein center" style="max-width:560px;margin:0 auto">'
   +'<div class="ananse-wrap">'+ananseSVG(140,"idle")+'</div>'
   +'<h1>What grade are you in, '+esc(P.name)+'?</h1>'
   +'<div class="speech">'+(first?'This helps me pick the right lessons — the same skills your teachers in Anne Arundel County work on.':'Pick your grade so I can show the right lessons.')+'</div>'
   +'<div class="spacer"></div>'
   +'<div class="opts">'+[3,4,5].map(g=>'<button class="opt" style="justify-content:center;font-size:24px" onclick="setGrade('+g+')"><span>'+GRADE_NAMES[g]+'</span></button>').join("")+'</div>'
   +'<p class="muted" style="margin-top:12px">A parent can change this any time in the Parent Portal.</p></div>';
  say("What grade are you in, "+P.name+"?");
}
function setGrade(g){P.grade=g;save();const fn=_gradeAfter;_gradeAfter=null;if(fn)fn();else renderHome();}
function diagIntro(){
  D.plan=DIAG_ORDER.map(s=>({s,lvl:2,asked:0,correct:0,hist:[],story:null,qs:null,used:[]}));
  D.si=0;D.i=0;D.total=DIAG_ORDER.length*DIAG_PER_SUBJECT;
  const t=D.retest?"Time for a quick re-check, "+esc(P.name)+"! Walk the Explorer's Trail again so I can see how much you have grown. Your trophies and streak stay safe.":"Walk the Explorer's Trail with me, "+esc(P.name)+"! "+D.total+" fun challenges across every subject — no scores, no pressure. Each answer helps me set the right level for you. Some will be easy, some tricky. Just try your best!";
  app.innerHTML='<div class="fadein center" style="max-width:560px;margin:0 auto">'
   +'<div class="ananse-wrap">'+ananseSVG(170,"idle")+'</div>'
   +'<h1>The Explorer\'s Trail 🗺️</h1>'
   +'<div class="speech">'+t+'</div>'
   +'<div class="spacer"></div>'
   +'<button class="btn big" onclick="diagNextQ()">Start the Trail! 🥾</button></div>';
  say(D.retest?"Time for a quick re-check! Walk the Explorer's Trail again so I can see how much you have grown.":"Walk the Explorer's Trail with me, "+P.name+"! "+D.total+" fun challenges. No pressure — just try your best!");
}
/* question pool at a level: base bank + the learner's grade lessons at that level */
function diagPick(st){
  if(st.s==="math")return genMath(st.lvl);
  const base=(BANK[st.s]&&BANK[st.s][st.lvl])?BANK[st.s][st.lvl]:[];
  const les=lessonQuestions(st.s,P.grade).filter(q=>q.level===st.lvl);
  let pool=base.concat(les).filter(q=>!st.used.includes(q.q));
  if(!pool.length)pool=base.concat(les);
  const q=Object.assign({},pick(pool));
  q.subject=st.s;q.level=st.lvl;st.used.push(q.q);
  return q;
}
function diagNextQ(){
  const st=D.plan[D.si];
  if(!st)return diagReport();
  if(st.asked>=DIAG_PER_SUBJECT){D.si++;return diagNextQ();}
  if(st.s==="comprehension"&&!st.story){
    // story FIRST, then its questions — never a question about a story the child has not read
    const les=lessonsFor(P.grade,"comprehension");
    const L=les.length?pick(les):null;
    const story=L?Object.assign({},L.story,{qs:L.qs}):pick(STORIES[2]);
    st.story=story;st.qs=story.qs.slice(0,DIAG_PER_SUBJECT).map(q=>Object.assign({},q,{subject:"comprehension",level:2}));
    diagStory(st);return;
  }
  diagQuestion();
}
function diagStory(st){
  app.innerHTML='<div class="fadein" style="max-width:640px;margin:0 auto">'
   +'<div class="hud"><span class="pill">🗺️ Explorer\'s Trail</span><span class="pill">📖 Story time</span></div>'
   +'<div class="center"><div class="ananse-wrap">'+ananseSVG(100,"teach")+'</div>'
   +'<div class="speech" style="max-width:480px;margin:10px auto">Read this story slowly. When you finish, I will ask you '+DIAG_PER_SUBJECT+' questions about it.</div></div>'
   +'<div class="spacer"></div>'
   +'<div class="card gold"><h2 style="margin-bottom:10px">📖 '+esc(st.story.title)+'</h2>'
   +'<p style="font-size:21px;line-height:1.8">'+esc(st.story.text)+'</p></div>'
   +'<div class="center"><div class="spacer"></div><div class="btn-row">'
   +'<button class="btn big" onclick="diagQuestion()">I read it — Quiz me! ✅</button>'
   +'<button class="btn secondary" onclick="say(D.plan[D.si].story.text)">🔊 Read it to me</button></div></div>';
  say("Here is your story: "+st.story.title+". Read it slowly. Tap quiz me when you are ready.");
}
function diagQuestion(){
  const st=D.plan[D.si];
  const q=st.s==="comprehension"?st.qs[st.asked]:diagPick(st);
  D.q=q;
  const order=shuffle(q.opts.map((_,i)=>i));
  D.order=order;
  const letters=["A","B","C","D"];
  app.innerHTML='<div class="fadein">'
   +'<div class="hud"><span class="pill">🗺️ Explorer\'s Trail</span><span class="pill">Stone <b>'+(D.i+1)+'</b> of '+D.total+'</span><span class="pill">'+SUBJECTS[q.subject].icon+' '+SUBJECTS[q.subject].name+'</span></div>'
   +'<div class="bar" style="margin-bottom:18px"><i style="width:'+Math.round(D.i/D.total*100)+'%"></i></div>'
   +'<div class="card gold"><p class="qtext">'+esc(q.q)+'</p>'
   +'<div class="center" style="margin:-4px 0 10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="readbtn" onclick="say(D.q.q)">🔊 Read it again</button>'
   +(st.story?'<button class="readbtn" onclick="diagStoryAgain()">📖 Read the story again</button>':'')+'</div>'
   +'<div class="opts">'+order.map((oi,pos)=>'<button class="opt" id="dopt'+pos+'" onclick="diagAnswer('+pos+')"><span class="letter">'+letters[pos]+'</span><span>'+esc(q.opts[oi])+'</span></button>').join("")+'</div>'
   +'<div class="center" style="margin-top:14px"><button class="readbtn" onclick="diagAnswer(null)">Not sure yet — skip →</button></div>'
   +'</div></div>';
  say(q.q);
}
function diagStoryAgain(){
  const st=D.plan[D.si];if(!st||!st.story)return;
  openOverlay('<div><h2 style="margin-bottom:10px">📖 '+esc(st.story.title)+'</h2><p style="font-size:20px;line-height:1.8;text-align:left">'+esc(st.story.text)+'</p><div class="spacer"></div><div class="btn-row"><button class="btn secondary" onclick="say(D.plan[D.si].story.text)">🔊 Read it to me</button><button class="btn big" onclick="closeOverlay()">Back to the question ▶</button></div></div>');
}
function diagAnswer(pos){
  const st=D.plan[D.si],q=D.q;
  const correct=pos!==null&&D.order[pos]===q.a;
  D.order.forEach((oi,p)=>{const b=$("dopt"+p);if(b){b.classList.add(p===pos?(correct?"correct":"dim"):"dim");b.onclick=null}});
  st.asked++;if(correct)st.correct++;
  st.hist.push({lvl:q.level,ok:correct,skipped:pos===null});
  if(st.s!=="comprehension")st.lvl=Math.max(1,Math.min(5,st.lvl+(correct?1:-1))); // staircase: harder after right, easier after wrong
  D.i++;
  const cheer=pos===null?pick(["No problem — onward!","Skipping is allowed. Next stone!"]):(correct?pick(["Nice thinking!","You found the path!","Onward, explorer!"]):pick(["Good try — onward!","Tricky stone! Keep walking.","Every step teaches us. Onward!"]));
  toast(cheer);say(cheer);
  setTimeout(diagNextQ,1000);
}
function diagPlacement(st){
  if(st.s==="comprehension"){const c=st.correct;return c>=4?4:(c===3?3:(c===2?2:1));}
  return Math.max(1,Math.min(5,st.lvl));
}
function diagReadiness(lvl){return lvl>=4?"Above grade level":(lvl>=2?"On grade level":"Building the basics")}
function diagReport(){
  const lvls={},score={},words={};
  D.plan.forEach(st=>{
    const l=diagPlacement(st);
    lvls[st.s]=l;score[st.s]=st.correct;
    words[st.s]=(l>=4?"Ready for big challenges right away!":(l>=2?"Solid ground — we build up from grade level.":"We will start gently and grow strong together."))+" ("+st.correct+" of "+st.asked+")";
  });
  const rec={date:today(),grade:P.grade,score,levels:lvls,retest:D.retest};
  P.levels=lvls;P.diagDone=true;P.retest=false;P.diag=rec;
  P.diagHistory=P.diagHistory||[];P.diagHistory.push(rec);
  save();
  app.innerHTML='<div class="fadein" style="max-width:620px;margin:0 auto">'
   +'<div class="center"><div class="ananse-wrap ananse-celebrate">'+ananseSVG(140,"party")+'</div>'
   +'<h1>Trail Complete! 🎉</h1>'
   +'<div class="speech">'+(D.retest?'Re-check done, '+esc(P.name)+'! Here is your updated map.':'You finished the Explorer\'s Trail, '+esc(P.name)+'! Here is the map of where each adventure begins. Remember — every explorer starts somewhere, and every path leads up!')+'</div></div>'
   +'<div class="spacer"></div>'
   +Object.keys(SUBJECTS).map(s=>'<div class="card" style="margin-bottom:12px"><div class="report-row" style="margin:0"><span class="rn">'+SUBJECTS[s].icon+' '+SUBJECTS[s].name+'</span><div class="bar" style="flex:1"><i style="width:'+(lvls[s]/5*100)+'%"></i></div><span class="lvl-badge">LVL '+lvls[s]+'</span></div><p class="muted" style="margin-top:8px"><b>'+diagReadiness(lvls[s])+'</b> · '+words[s]+'</p></div>').join("")
   +'<div class="center"><div class="spacer"></div><button class="btn big" onclick="goHome()">Start My Adventure! 🚀</button></div></div>';
  say(D.retest?"Re-check complete! Here is your updated map.":"Trail complete! Here is your adventure map. Every path leads up from here!");
  confetti();
}
/* parent-portal helpers */
function parentRetestNow(){closeOverlay();toast("Hand the device to "+P.name);startDiagnostic({retest:true});}
function parentRetestNext(){P.retest=!P.retest;save();toast(P.retest?"Re-check will run at "+P.name+"'s next login":"Re-check cancelled");renderParent();}
function parentSetGrade(){const v=+($("gradeSel")&&$("gradeSel").value);if(GRADE_NAMES[v]){P.grade=v;save();toast("Grade saved: "+GRADE_NAMES[v]);renderParent();}}
function trailHistoryHTML(){
  const h=(P.diagHistory||[]).slice().reverse().slice(0,6);
  if(!h.length)return '<p class="muted">No trail results yet.</p>';
  return h.map(r=>'<div class="statline"><span>'+esc(r.date)+(r.retest?' · re-check':' · first trail')+(r.grade?' · '+GRADE_NAMES[r.grade]:'')+'</span><b style="font-size:15px">'+Object.keys(SUBJECTS).map(s=>SUBJECTS[s].icon+(r.levels&&r.levels[s]||"?")).join(" ")+'</b></div>').join("");
}
function lessonProgressHTML(){
  const g=P.grade;if(!g)return '<p class="muted">Set a grade to unlock lessons.</p>';
  const all=lessonsFor(g);const done=all.filter(L=>P.lessons&&P.lessons[L.id]);
  const rows=all.map(L=>{const r=P.lessons&&P.lessons[L.id];return '<div class="statline"><span>'+SUBJECTS[L.subject].icon+' '+esc(L.title)+' <span class="muted" style="font-size:13px">'+esc(L.std)+'</span></span><b style="font-size:15px;color:'+(r?(r.correct/r.total>=0.8?"#2f8f4e":"#e0512f"):"#6f88ad")+'">'+(r?r.correct+"/"+r.total:"not yet")+'</b></div>'}).join("");
  const labs=LABS.map(L=>'<div class="statline"><span>'+L.icon+' '+esc(L.title)+' <span class="muted" style="font-size:13px">'+esc(L.std)+'</span></span><b style="font-size:15px;color:'+(P.lab&&P.lab[L.id]?"#2f8f4e":"#6f88ad")+'">'+(P.lab&&P.lab[L.id]?"solved · notebook "+P.lab[L.id].notebook:"not yet")+'</b></div>').join("");
  return '<p class="muted">'+done.length+' of '+all.length+' '+GRADE_NAMES[g]+' lessons completed.</p><div class="card" style="margin-top:10px">'+rows+'</div>'
   +'<h3 style="margin-top:16px">🧪 Science Lab quests</h3><p class="muted">Hands-on experiments: the child changes variables and watches what happens, then answers a 2-question notebook.</p><div class="card" style="margin-top:10px">'+labs+'</div>';
}

/* ============================================================
   GRADE LESSONS — Maryland standards, taught then practiced
   ============================================================ */
function renderLessons(){
  clearTimers();closeOverlay();defocus();showAnanseCorner(true);
  if(!P.grade){pickGradeThen(renderLessons,false);return;}
  const g=P.grade;
  const groups=["math","english","comprehension","science"].map(sub=>{
    const ls=lessonsFor(g,sub);if(!ls.length)return "";
    const cards=ls.map(L=>{
      const r=P.lessons&&P.lessons[L.id];

let DC=null;
function startDaily(){
  if(P.daily.date===today()&&P.daily.done){

  }
  const q=DAILY_BANK[(dayOfYear()+P.id.length)%DAILY_BANK.length];
  DC={q};
  clearTimers();showAnanseCorner(false);
  const order=shuffle(q.opts.map((_,i)=>i));
  DC.order=order;
  const letters=["A","B","C","D"];
  app.innerHTML='<div class="fadein">'
   +'<div class="center"><h1>🕵️ Daily Mystery Challenge</h1>'
   +'<p class="muted">'+esc(q.mix)+' · one chance per day · special trophy at stake</p>'
   +'<div class="ananse-wrap">'+ananseSVG(110,"teach")+'</div>'
   +'<div class="speech" style="max-width:480px;margin:10px auto">Detective '+esc(P.name)+', this case needs TWO kinds of thinking. Read every clue slowly...</div></div>'

   +'</div></div>';
  say("Detective "+P.name+", here is today's mystery. "+q.q);
}
function dailyAnswer(pos){
  const q=DC.q;
  const correct=DC.order[pos]===q.a;
  DC.order.forEach((oi,p)=>{const b=$("yopt"+p);if(!b)return;
    if(oi===q.a)b.classList.add("correct");else if(p===pos&&!correct)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null});
  const praise=pick(PRAISE);
  if(correct)setTimeout(()=>finishDaily(true,praise),900);
  else setTimeout(()=>{
    openOverlay('<div class="center"><div class="ananse-wrap">'+ananseSVG(110,"teach")+'</div><div class="speech">'+esc(praise)+'</div><p class="muted" style="margin-top:10px">Every great detective studies the case. Let me walk you through it.</p><div class="spacer"></div><button class="btn big" onclick="dailyTeach()">Show me the clues 🔍</button></div>');
    say(praise+". Let me walk you through the case.");
  },900);
}
function dailyTeach(){
  T={q:DC.q,step:0,from:"daily"};
  T.q.practice=null;
  renderTeachStepDaily();
}
function renderTeachStepDaily(){
  const steps=T.q.teach,st=steps[T.step];

   +'<div class="teach-illus">'+st.i+'</div><p class="teach-text">'+esc(st.t)+'</p>'

function subjAccuracy(subj,sinceT,untilT){
  let c=0,t=0;
  P.sessions.forEach(s=>{
    if(subj&&s.subject!==subj)return;
    if(sinceT&&(s.t||0)<sinceT)return;
    if(untilT&&(s.t||0)>=untilT)return;
    c+=s.correct;t+=s.total;
  });
  return t?c/t:null;
}

function sessSum(sessions,field){return sessions.reduce((a,s)=>a+(s[field]||0),0);}
function accPct(c,t){return t?Math.round(100*c/t):null;}
function interventionStats(){
  const ss=P.sessions||[];
  const now=Date.now(),wk=7*864e5;
  const thisW=ss.filter(s=>(s.t||0)>=now-wk);
  const lastW=ss.filter(s=>(s.t||0)>=now-2*wk&&(s.t||0)<now-wk);
  const wpThis=accPct(sessSum(thisW,"wpC"),sessSum(thisW,"wpT"));
  const wpLast=accPct(sessSum(lastW,"wpC"),sessSum(lastW,"wpT"));
  const recallThis=accPct(sessSum(thisW,"recallC"),sessSum(thisW,"recallT"));
  const recallLast=accPct(sessSum(lastW,"recallC"),sessSum(lastW,"recallT"));
  const reviewThis=accPct(sessSum(thisW,"reviewC"),sessSum(thisW,"reviewT"));
  const mfThis=accPct(sessSum(thisW,"mfC"),sessSum(thisW,"mfT"));
  const durs=thisW.filter(s=>s.durMs).map(s=>s.durMs);
  const avgMin=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length/60000*10)/10:null;
  return {wpThis,wpLast,recallThis,recallLast,reviewThis,mfThis,avgMin,games:thisW.length};
}
function trend(now,prev){
  if(now===null)return"";
  if(prev===null)return' <span class="muted" style="font-size:14px">(new)</span>';
  if(now>prev)return' <span style="color:#3bb273;font-size:14px">▲ up '+(now-prev)+'</span>';
  if(now<prev)return' <span style="color:#e0512f;font-size:14px">▼ down '+(prev-now)+'</span>';
  return' <span class="muted" style="font-size:14px">(steady)</span>';
}

    if(!incoming||!Array.isArray(incoming.profiles)){toast("That file isn't a Learning Zone backup");return;}

  const taughtTopics=[...new Set(P.wrongLog.filter(w=>w.date===t).map(w=>w.topic))];
  const taught=taughtTopics.length?taughtTopics.join(", "):"No reteaching needed today";

    ?"\"I heard you kept working even on the tricky "+(weak||"questions")+" today. That kind of effort is exactly how champions are built.\""

  if(typeof navigator!=="undefined"&&navigator&&navigator.onLine===false)return false;

    body:JSON.stringify({chat_id:tg.chat,text:text})

}

  if((tg.lastSent||"").startsWith(today()))return;
  const [h,m]=(tg.time||"19:00").split(":").map(Number);

function alertOnce(key,text){
  // dedupe per profile per day
  if(!P)return;
  P.alertLog=P.alertLog||{};
  const stamp=today()+"|"+key;
  if(P.alertLog[key]===today())return;        // already sent today
  if(tgSend("🦁 Learning Zone Alert — "+P.name+"\n\n"+text)){P.alertLog[key]=today();save();}

function checkAlerts(){
  if(!P)return;
  const tg=DB.telegram;if(!tg||!tg.token||!tg.chat)return;
  const m=interventionStats();
  // 1) word-problem accuracy below 60%
  if(m.wpThis!==null&&m.wpThis<60){
    alertOnce("wp_low","⚠️ Word-problem accuracy is "+m.wpThis+"% this week (target 60%+). Try a few coin/counter problems together at home.");
  }
  // 2) opening-review accuracy declining 2+ consecutive days
  if(reviewDecline2Days())alertOnce("review_decline","📉 Opening-review accuracy has dropped two days running. The earlier material needs another pass — Ananse is re-queuing it.");
  // 3) most recent session under 5 minutes
  const last=(P.sessions||[]).slice(-1)[0];
  if(last&&last.durMs&&last.durMs<5*60000&&!last.replay){
    alertOnce("short_session","⏱️ The last session ran under 5 minutes ("+Math.max(1,Math.round(last.durMs/60000))+" min). A short check-in can help him settle into a longer focus block.");
  }
}
function reviewDecline2Days(){
  // group review accuracy by date, check last 3 days strictly decreasing
  const byDay={};
  (P.sessions||[]).forEach(s=>{if(s.reviewT){const d=s.date;byDay[d]=byDay[d]||{c:0,t:0};byDay[d].c+=s.reviewC;byDay[d].t+=s.reviewT;}});
  const days=Object.keys(byDay).sort().slice(-3);
  if(days.length<3)return false;
  const a=byDay[days[0]],b=byDay[days[1]],c=byDay[days[2]];
  const pa=a.c/a.t,pb=b.c/b.t,pc=c.c/c.t;
  return pc<pb&&pb<pa;
}

}
