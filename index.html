function pondDraw(week,algae,oxy,fish){
  const c=LAB.c,x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  const g=Math.min(1,algae/10);
  x.fillStyle="rgb("+Math.round(40+60*g)+","+Math.round(120+80*g)+","+Math.round(200-150*g)+")";x.fillRect(0,60,c.width,200);
  x.font="22px system-ui";for(let i=0;i<Math.min(fish,30);i++){x.fillText(oxy<4?"🐟":"🐠",30+(i%10)*55,110+Math.floor(i/10)*50);}
  x.fillStyle="#edf7ff";x.font="16px system-ui";x.fillText("Week "+week+"  ·  algae "+algae.toFixed(1)+"  ·  oxygen "+oxy.toFixed(1)+" mg/L  ·  fish "+Math.round(fish),16,26);
  x.fillStyle=oxy>=6?"#3bb273":(oxy>=4?"#f5a623":"#e0512f");x.fillRect(16,36,Math.max(4,oxy/10*560),10);
}
function pondRun(){
  (LAB.timers||[]).forEach(clearInterval);LAB.timers=[];
  const fert=labVal("fert"),trees=labVal("trees");let fish=labVal("fish"),algae=2,week=0;
  const iv=setInterval(()=>{
    week++;
    const runoff=fert*(1-trees/12);
    algae=Math.max(0.5,algae*0.8+runoff*0.9);
    const oxy=Math.max(0,9.5-algae*0.65);
    if(oxy<4)fish=fish*0.72;else if(oxy>=6)fish=Math.min(40,fish*1.08);
    pondDraw(week,algae,oxy,fish);
    if(week>=10){clearInterval(iv);
      if(oxy>=6&&fish>=20)labGoalMet("Oxygen "+oxy.toFixed(1)+" and "+Math.round(fish)+" fish — the pond is alive again!");
      else labFeedback("Week 10: oxygen "+oxy.toFixed(1)+", fish "+Math.round(fish)+". "+(oxy<6?"Algae are still eating the oxygen — cut the runoff or catch it with trees.":"Oxygen is fine but there were not enough fish to start.")+" Adjust and run again.","warn");
    }
  },420);
  LAB.timers.push(iv);
}

/* ---------- 5. Bridge Builder ---------- */
function labBridge(area){
  LAB.supports=[];
  area.innerHTML='<p class="muted center">Tap the bridge deck to place a support (3 max). Then send the bus.</p><div id="bridgeStage"></div><div class="btn-row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="bridgeGo()">🚌 Send the bus</button><button class="btn secondary" onclick="LAB.supports=[];bridgeDraw();">Clear supports</button></div>';
  const c=labCanvas(600,240);$("bridgeStage").appendChild(c);LAB.c=c;
  c.addEventListener("click",ev=>{if(LAB.busX!=null)return;const r=c.getBoundingClientRect();const x=(ev.clientX-r.left)*(c.width/r.width);if(x<60||x>540)return;if(LAB.supports.length>=3){labFeedback("Only 3 supports — tap Clear to start over.","warn");return;}LAB.supports.push(Math.round(x));LAB.supports.sort((a,b)=>a-b);sfx("tick");bridgeDraw();});
  bridgeDraw();
}
function bridgeSpans(){const pts=[50].concat(LAB.supports,[550]);const out=[];for(let i=0;i<pts.length-1;i++)out.push([pts[i],pts[i+1]]);return out;}
function bridgeDraw(busX,broken){
  const c=LAB.c,x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  x.fillStyle="#2a5fa8";x.fillRect(50,150,500,90);x.fillStyle="#5a7d3a";x.fillRect(0,120,50,120);x.fillRect(550,120,50,120);
  const LIMIT=190;
  bridgeSpans().forEach(([a,b])=>{
    const L=b-a,sag=Math.min(40,(L/LIMIT)*(L/LIMIT)*14);
    const bad=broken&&L>LIMIT;
    x.strokeStyle=bad?"#e0512f":(L>LIMIT?"#f5a623":"#c9a84c");x.lineWidth=8;x.beginPath();x.moveTo(a,120);x.quadraticCurveTo((a+b)/2,120+sag*2,b,120);x.stroke();
    if(bad){x.fillStyle="#ffd166";x.font="15px system-ui";x.fillText("⚡ too long: "+L+" px",(a+b)/2-45,120+sag+34);}
  });
  LAB.supports.forEach(s=>{x.fillStyle="#8d6e63";x.fillRect(s-6,120,12,120);});
  x.fillStyle="#9fd0ff";x.font="15px system-ui";x.fillText("supports: "+LAB.supports.length+"/3 · spans longer than "+LIMIT+" px turn orange (risky)",16,22);
  if(busX!=null){x.font="30px system-ui";x.fillText("🚌",busX-15,112);}
}
function bridgeGo(){
  if(LAB.raf)cancelAnimationFrame(LAB.raf);
  const LIMIT=190;const bad=bridgeSpans().find(([a,b])=>b-a>LIMIT);
  let bx=20;const start=performance.now();
  const step=now=>{
    bx=20+(now-start)/2200*560;
    LAB.busX=bx;
    if(bad&&bx>=(bad[0]+bad[1])/2){LAB.busX=null;bridgeDraw((bad[0]+bad[1])/2,true);
      const c=LAB.c,x=c.getContext("2d");x.font="30px system-ui";x.fillText("💥",(bad[0]+bad[1])/2-15,160);
      sfx("wrong");labFeedback("Crack! The span from "+bad[0]+" to "+bad[1]+" is "+(bad[1]-bad[0])+" px — longer than the "+LIMIT+" px this deck can hold under a bus. Add a support inside the red span and try again.","warn");return;}
    bridgeDraw(bx,false);
    if(bx<580)LAB.raf=requestAnimationFrame(step);
    else{LAB.busX=null;labGoalMet("The bus made it across with "+LAB.supports.length+" support"+(LAB.supports.length===1?"":"s")+"!");}
  };
  LAB.raf=requestAnimationFrame(step);
}

function soundDraw(buf,amp,freq){
  const c=LAB.c,x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  x.strokeStyle="rgba(159,208,255,.35)";x.lineWidth=1;x.beginPath();x.moveTo(0,110);x.lineTo(600,110);x.stroke();
  x.strokeStyle="rgba(255,209,102,.5)";x.setLineDash([6,6]);x.beginPath();x.moveTo(0,55);x.lineTo(600,55);x.moveTo(0,165);x.lineTo(600,165);x.stroke();x.setLineDash([]);
  x.strokeStyle=amp>0.5?"#ffd166":"#6fd0ff";x.lineWidth=3;x.beginPath();
  for(let i=0;i<600;i++){const v=buf[Math.floor(i*buf.length/600)]||0;const y=110-v*100;i?x.lineTo(i,y):x.moveTo(i,y);}x.stroke();
  x.fillStyle="#edf7ff";x.font="15px system-ui";x.fillText("amplitude (loudness): "+(amp*100).toFixed(0)+"%   ·   pitch ≈ "+Math.round(freq)+" Hz",16,22);
  x.fillText("reach the dashed lines = LOUD",400,50);
}
function soundCheck(amp,freq){
  if(amp>0.5&&!LAB.flags.loud){LAB.flags.loud=true;$("sLoud").textContent="✓";sfx("tick");}
  if(freq>600&&amp>0.15&&!LAB.flags.high){LAB.flags.high=true;$("sHigh").textContent="✓";sfx("tick");}
  if(LAB.flags.loud&&LAB.flags.high)labGoalMet("You made a tall wave AND a squeezed wave — amplitude and wavelength!");
}
async function soundStart(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});LAB.stream=stream;
    const actx=new (window.AudioContext||window.webkitAudioContext)();LAB.actx=actx;
    const src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();an.fftSize=2048;src.connect(an);
    const buf=new Float32Array(an.fftSize);$("micBtn").textContent="🎤 Listening… clap, sing, whistle!";
    const loop=()=>{
      an.getFloatTimeDomainData(buf);
      let amp=0,zc=0;for(let i=1;i<buf.length;i++){amp=Math.max(amp,Math.abs(buf[i]));if((buf[i-1]<0&&buf[i]>=0))zc++;}
      const freq=zc*actx.sampleRate/buf.length;
      soundDraw(buf,amp,amp>0.05?freq:0);soundCheck(amp,amp>0.05?freq:0);
      LAB.raf=requestAnimationFrame(loop);
    };loop();
  }catch(e){labFeedback("I could not reach the microphone ("+(e.name||"blocked")+"). Use the simulate buttons below instead — the science is the same.","warn");}
}
function soundSim(amp,freq){
  if(LAB.raf)cancelAnimationFrame(LAB.raf);
  const buf=new Float32Array(600);const start=performance.now();
  const loop=now=>{const t=(now-start)/1000;for(let i=0;i<600;i++)buf[i]=amp*Math.sin((i/600)*freq/40*Math.PI*2+t*8);soundDraw(buf,amp,freq);soundCheck(amp,freq);LAB.raf=requestAnimationFrame(loop);};
  LAB.raf=requestAnimationFrame(loop);
}

/* ---------- 7. Balance the Ball (tilt sensor) ---------- */
function labTilt(area){
  area.innerHTML='<div id="tiltStage"></div><div class="btn-row" style="justify-content:center;margin-top:8px"><button class="btn" id="tiltBtn" onclick="tiltStart()">📱 Use my device\'s tilt sensor</button></div>'
   +'<div class="tilt-pad"><button class="btn secondary" onclick="tiltPush(0,-1)">▲</button><div><button class="btn secondary" onclick="tiltPush(-1,0)">◀</button><button class="btn secondary" onclick="tiltPush(1,0)">▶</button></div><button class="btn secondary" onclick="tiltPush(0,1)">▼</button></div>';
  const c=labCanvas(600,300);$("tiltStage").appendChild(c);LAB.c=c;
  LAB.b={x:120,y:90,vx:0,vy:0,ax:0,ay:0,held:0,last:performance.now()};
  LAB.cleanup=()=>{if(LAB.onOri)window.removeEventListener("deviceorientation",LAB.onOri);};
  const loop=now=>{
    const b=LAB.b,dt=Math.min(0.05,(now-b.last)/1000);b.last=now;
    b.vx=(b.vx+b.ax*300*dt)*0.985;b.vy=(b.vy+b.ay*300*dt)*0.985;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<20){b.x=20;b.vx*=-0.5}if(b.x>580){b.x=580;b.vx*=-0.5}if(b.y<20){b.y=20;b.vy*=-0.5}if(b.y>280){b.y=280;b.vy*=-0.5}
    const inside=Math.hypot(b.x-300,b.y-150)<40;
    b.held=inside?b.held+dt:0;
    tiltDraw(inside);
    if(b.held>=3)labGoalMet("Three seconds of balance — every push and pull cancelled out.");
    if(!LAB.goalMet)LAB.raf=requestAnimationFrame(loop);
  };
  LAB.raf=requestAnimationFrame(loop);
}
function tiltDraw(inside){
  const c=LAB.c,x=c.getContext("2d"),b=LAB.b;x.clearRect(0,0,c.width,c.height);
  x.strokeStyle=inside?"#3bb273":"rgba(255,209,102,.7)";x.lineWidth=4;x.beginPath();x.arc(300,150,40,0,7);x.stroke();
  x.fillStyle="#f5a623";x.beginPath();x.arc(b.x,b.y,16,0,7);x.fill();
  x.fillStyle="#edf7ff";x.font="15px system-ui";x.fillText("tilt: x "+b.ax.toFixed(2)+"  y "+b.ay.toFixed(2)+"   ·   balanced for "+b.held.toFixed(1)+" s / 3",16,22);
}
function tiltPush(dx,dy){LAB.b.vx+=dx*120;LAB.b.vy+=dy*120;sfx("tick");}
async function tiltStart(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")throw new Error("denied");}
    LAB.onOri=ev=>{if(ev.gamma==null)return;LAB.b.ax=Math.max(-1,Math.min(1,ev.gamma/30));LAB.b.ay=Math.max(-1,Math.min(1,(ev.beta-40)/30));};
    window.addEventListener("deviceorientation",LAB.onOri);
    $("tiltBtn").textContent="📱 Tilt your device to roll the ball";
    setTimeout(()=>{if(LAB&&LAB.b&&LAB.b.ax===0&&LAB.b.ay===0)labFeedback("No tilt data is arriving — this device may not have a sensor. The arrow buttons work the same way.","info");},2500);
  }catch(e){labFeedback("The tilt sensor is not available here. Use the arrow buttons — each tap is a push (an unbalanced force).","info");}
}

 {e:"🌌",n:"The Solar System",s:"about 10,000,000,000 km across",t:"Eight planets circle the Sun. Earth is the third one out."},
 {e:"🌍",n:"Earth",s:"12,700 km wide",t:"A rocky planet wrapped in air and mostly covered by ocean."},
 {e:"🗺️",n:"Maryland",s:"about 400 km across",t:"Home of the Chesapeake Bay, the biggest estuary in the United States."},

 {e:"⚛️",n:"An atom",s:"0.1 nanometres — 1,000,000× smaller than a hair is wide",t:"Everything is made of atoms: a tiny nucleus with electrons whizzing around it."}

function labZoom(area){

/* ---------- 9. Nature Walk (camera + real-world observation) ----------
   The child photographs a living thing, records what they observe, then
   Ananse identifies it: plants via Pl@ntNet (free key set in the parent
   portal), bugs by counting legs/wings (classification), birds and other
   animals by the child's best guess — every result becomes a field-guide
   card fetched from Wikipedia. Needs internet; the observation notebook
   works offline and the ID runs when a connection is back. */
const NATURE_TYPES={plant:{e:"🌿",n:"Plant",organs:["leaf","flower","fruit","bark"],
  obs:[{k:"where",q:"Where was it growing?",o:["In the ground","In a pot","On a wall or tree","In water"]},{k:"leaf",q:"What shape are the leaves?",o:["Long and thin","Round or oval","Pointy with teeth","Needles"]},{k:"color",q:"Any flowers or fruit? What color?",o:["No flowers","White or yellow","Pink, red or purple","Green fruit or berries"]}]},
 bug:{e:"🐛",n:"Bug",obs:[{k:"legs",q:"Count the legs. How many?",o:["6 legs","8 legs","More than 8","No legs I can see"]},{k:"wings",q:"Does it have wings?",o:["Yes","No","I could not tell"]},{k:"where",q:"Where did you find it?",o:["On a leaf or flower","On the ground or under a rock","In a web","Flying or on a wall"]}]},
 bird:{e:"🐦",n:"Bird",obs:[{k:"size",q:"How big was it?",o:["Sparrow size (small)","Robin size (medium)","Crow size (large)","Bigger than a crow"]},{k:"color",q:"Main colors?",o:["Brown or grey","Black","Red or orange","Blue or bright"]},{k:"doing",q:"What was it doing?",o:["Eating or pecking","Singing","Flying","Sitting still"]}]},
 other:{e:"🐾",n:"Other animal",obs:[{k:"cover",q:"What covers its body?",o:["Fur","Scales","Smooth wet skin","Shell"]},{k:"where",q:"Where was it?",o:["On land","In water","In a tree","Under something"]},{k:"move",q:"How does it move?",o:["Runs or walks","Hops","Slides or crawls","Swims"]}]}};
function bugGroup(o){
  if(o.legs==="6 legs")return {name:"Insect",wiki:"Insect",why:"6 legs and 3 body parts means it is an insect."};
  if(o.legs==="8 legs")return {name:"Arachnid (spider family)",wiki:"Arachnid",why:"8 legs means an arachnid — spiders, ticks and mites."};
  if(o.legs==="More than 8")return {name:"Myriapod (centipede or millipede)",wiki:"Myriapoda",why:"Lots of legs in a row means a centipede or millipede."};
  return {name:"Worm, slug or snail",wiki:"Invertebrate",why:"No legs — it moves by sliding, like worms, slugs and snails."};
}
function labNature(area){
  LAB.n={type:null,obs:{},thumb:null,id:null};
  const journal=(P.nature||[]).slice().reverse().slice(0,8).map(e=>'<div class="statline"><span>'+(e.thumb?'<img src="'+e.thumb+'" class="nat-thumb">':NATURE_TYPES[e.type].e)+' <b>'+esc(e.name)+'</b> <span class="muted" style="font-size:13px">'+esc(e.date)+'</span></span><span class="muted" style="font-size:13px">'+esc(e.note||"")+'</span></div>').join("");
  area.innerHTML='<div id="natStep"></div>'+(journal?'<h3 style="margin-top:16px">📓 My Field Journal</h3><div class="card" style="margin-top:8px">'+journal+'</div>':'');
  natStep1();
}
function natStep1(){
  $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 1 · Go outside (a yard, park or window box counts). What did you find?</p><div class="opts">'+Object.keys(NATURE_TYPES).map(k=>'<button class="opt" style="justify-content:center;font-size:20px" onclick="natType(\''+k+'\')">'+NATURE_TYPES[k].e+' '+NATURE_TYPES[k].n+'</button>').join("")+'</div>';
}
function natType(t){
  LAB.n.type=t;sfx("tick");
  $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 2 · Take a photo of it (get close, hold still)</p>'
   +'<div class="center"><label class="btn" style="display:inline-block;cursor:pointer">📷 Take or choose a photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="natPhoto(event)"></label></div>'
   +'<div id="natPreview" class="center" style="margin-top:10px"></div>'
   +'<div class="center" style="margin-top:8px"><button class="readbtn" onclick="natObs()">No camera — skip the photo →</button></div>';
}
function natPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  LAB.n.file=f;
  const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{
    const c=document.createElement("canvas");const s=Math.min(1,220/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);LAB.n.thumb=c.toDataURL("image/jpeg",0.6);
    URL.revokeObjectURL(url);
    $("natPreview").innerHTML='<img src="'+LAB.n.thumb+'" style="max-width:220px;border-radius:14px;border:3px solid #f5a623"><div class="spacer" style="height:8px"></div><button class="btn" onclick="natObs()">Looks good — next ▶</button>';
    sfx("tick");
  };
  img.src=url;
}
function natObs(){
  const T=NATURE_TYPES[LAB.n.type];LAB.n.oi=0;
  const step=()=>{
    const o=T.obs[LAB.n.oi];
    if(!o)return natIdentify();
    $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 3 · Scientist\'s eyes ('+(LAB.n.oi+1)+' of '+T.obs.length+')</p><p class="qtext" style="font-size:22px">'+esc(o.q)+'</p><div class="opts">'+o.o.map(v=>'<button class="opt" onclick="natAns(\''+o.k+'\',\''+v.replace(/'/g,"\\'")+'\')"><span>'+esc(v)+'</span></button>').join("")+'</div>';
    say(o.q);
  };
  LAB.n.next=step;step();
}
function natAns(k,v){LAB.n.obs[k]=v;LAB.n.oi++;sfx("tick");LAB.n.next();}
async function natIdentify(){
  const n=LAB.n,T=NATURE_TYPES[n.type];
  $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 4 · Ananse looks it up…</p><div class="center"><div class="ananse-wrap">'+ananseSVG(80,"teach")+'</div><p class="muted" id="natStatus">Thinking…</p></div>';
  if(n.type==="plant"){
    const key=(DB.plantnet&&DB.plantnet.key||"").trim();
    if(!n.file){return natGuess("I need a photo to identify a plant. Tell me your best guess instead.");}
    if(!key){return natGuess("Plant ID needs the free Pl@ntNet key — a parent can add it in the Parent Portal. For now, what do you think it is?");}
    if(!navigator.onLine){return natGuess("No internet right now. What do you think it is? I will remember your notes.");}
    try{
      const fd=new FormData();fd.append("images",n.file);fd.append("organs",n.obs.color&&n.obs.color!=="No flowers"?"flower":"leaf");
      const r=await fetch("https://my-api.plantnet.org/v2/identify/all?lang=en&api-key="+encodeURIComponent(key),{method:"POST",body:fd});
      if(!r.ok)throw new Error("Pl@ntNet said "+r.status);
      const j=await r.json();const res=(j.results||[]).slice(0,3);
      if(!res.length)throw new Error("no match");
      $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 4 · Ananse\'s best matches — pick the one that looks right</p><div class="opts">'+res.map((x,i)=>'<button class="opt" onclick="natPick('+i+')"><span><b>'+esc((x.species.commonNames&&x.species.commonNames[0])||x.species.scientificNameWithoutAuthor)+'</b><br><span class="muted" style="font-size:13px">'+esc(x.species.scientificNameWithoutAuthor)+' · '+Math.round(x.score*100)+'% sure</span></span></button>').join("")+'</div>';
      LAB.n.cands=res.map(x=>({name:(x.species.commonNames&&x.species.commonNames[0])||x.species.scientificNameWithoutAuthor,wiki:x.species.scientificNameWithoutAuthor}));
    }catch(e){natGuess("Pl@ntNet could not identify that photo ("+(e.message||"error")+"). Try a clearer, closer shot — or tell me your best guess.");}
    return;
  }
  if(n.type==="bug"){const g=bugGroup(n.obs);return natCard({name:g.name,wiki:g.wiki,why:g.why});}
  natGuess(T.e+" What do you think it is? Type a name (like 'robin' or 'grey squirrel') and I will look it up.");
}
function natGuess(msg){
  $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 4 · Your best guess</p><p class="muted center">'+esc(msg)+'</p><div class="center"><input id="natName" placeholder="What is it?" style="max-width:320px;text-align:center;font-size:20px"><div class="spacer" style="height:8px"></div><button class="btn" onclick="natLookup()">🔎 Look it up</button></div>';
}
const NAT_HINT={bird:{w:" bird North America",re:/bird|species/i},other:{w:" animal North America",re:/animal|mammal|reptile|amphibian|rodent|species|fish|crab/i},plant:{w:" plant",re:/plant|tree|flower|shrub|species|genus/i},bug:{w:" insect",re:/insect|arthropod|spider|arachnid|species|beetle|bug/i}};
async function wikiSummary(title){
  const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_")));
  if(!r.ok)return null;return r.json();
}
/* search Wikipedia for the child's guess, biased to the kind of living thing,
   and keep the first real (non-disambiguation) page that reads like one */
async function wikiBest(q,type){
  const h=NAT_HINT[type]||NAT_HINT.other;
  const r=await fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=4&srsearch="+encodeURIComponent(q+h.w));
  const j=await r.json();const titles=(j.query&&j.query.search||[]).map(x=>x.title);
  let fallback=null;
  for(const t of titles){
    const sj=await wikiSummary(t);if(!sj||sj.type==="disambiguation")continue;
    if(h.re.test((sj.description||"")+" "+(sj.extract||"").slice(0,160)))return sj;
    if(!fallback)fallback=sj;
  }
  return fallback;
}
async function natLookup(){
  const q=($("natName").value||"").trim();if(!q){toast("Type a name first");return;}
  natCard({name:q,wiki:q,search:true});
}
function natPick(i){const c=LAB.n.cands[i];natCard({name:c.name,wiki:c.wiki});}
async function natCard(x){
  LAB.n.id=x;
  let card='<div class="card gold" style="margin-top:10px"><h2>'+esc(x.name)+'</h2>'+(x.why?'<p style="font-weight:700">'+esc(x.why)+'</p>':'')+'<p class="muted" id="natWiki">Fetching Ananse\'s field guide…</p></div>';
  $("natStep").innerHTML='<p class="center" style="font-weight:800">Step 5 · Field guide</p>'+card+'<div class="center" style="margin-top:10px"><button class="btn big" onclick="natSave()">📓 Add to my Field Journal</button></div>';
  try{
    if(!navigator.onLine)throw new Error("offline");
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(x.wiki.replace(/ /g,"_")));
    let j=r.ok?await r.json():{type:"disambiguation"};
    if(x.search||j.type==="disambiguation"){const best=await wikiBest(x.wiki,LAB.n.type);if(best)j=best;}
    if(j.type==="disambiguation")throw new Error("no clear page");
    if(x.search&&j.title){LAB.n.id.name=j.title.toLowerCase()===x.name.toLowerCase()?j.title:x.name+" ("+j.title+")";}
    LAB.n.summary=(j.extract||"").split(". ").slice(0,3).join(". ")+".";
    $("natWiki").innerHTML=(j.thumbnail?'<img src="'+j.thumbnail.source+'" style="float:right;max-width:140px;border-radius:12px;margin:0 0 8px 12px">':'')+'<b>'+esc(j.title)+'</b><br>'+esc(LAB.n.summary)+'<br><small class="muted">from Wikipedia</small>';
    say(x.name+". "+LAB.n.summary);
  }catch(e){$("natWiki").textContent="The field guide needs internet — your observation is still saved. "+(x.why||"");}
}
function natSave(){
  const n=LAB.n;P.nature=P.nature||[];
  const note=Object.values(n.obs).join(" · ");
  P.nature.push({date:today(),type:n.type,name:n.id.name,note,thumb:n.thumb||null});
  while(P.nature.length>20)P.nature.shift();
  save();sfx("correct");
  labGoalMet(n.id.name+" is in your field journal with "+Object.keys(n.obs).length+" observations.");
  $("natStep").innerHTML='<div class="center"><p style="font-weight:800">Saved! Find another living thing?</p><button class="btn secondary" onclick="labNature($(\'labArea\'))">🍃 New observation</button></div>';
}

const REVEAL_REVIEW={
 "2-1":"Base-ten blocks show place value: a big cube is 1,000, a flat is 100, a rod is 10, a small cube is 1. The same number can be written in standard form (1,246), expanded form (1,000 + 200 + 40 + 6) and word form.",
 "2-2":"To round, find the halfway point. On a number line, 318 is closer to 320 than 310. With place value: look at the digit to the right of the place you are rounding to — 5 or more rounds up, 4 or less rounds down.",
 "2-3":"Estimate by rounding each number first, then adding or subtracting the rounded numbers. 318 + 276 is about 300 + 300 = 600.",
 "2-4":"Commutative property: order does not change a sum (4 + 9 = 9 + 4). Associative property: grouping does not change a sum ((2 + 8) + 5 = 2 + (8 + 5)). Use them to make tens.",
 "2-5":"Look for patterns: adding 10 changes only the tens digit; adding 100 changes only the hundreds digit. Even + even is even, odd + odd is even, even + odd is odd.",
 "2-6":"Partial sums: add the hundreds, then the tens, then the ones, and put the parts together. 346 + 228 → 500 + 60 + 14 = 574.",
 "2-7":"Decompose to subtract: break the number you take away into hundreds, tens and ones, and subtract one part at a time. 532 − 217 → 532 − 200 − 10 − 7 = 315.",
 "2-8":"Adjust numbers to make them friendly: 298 + 145 → 300 + 145 − 2. For subtraction, add the same amount to both numbers: 503 − 297 = 506 − 300.",
 "2-9":"Subtraction and addition are related. To find 600 − 385, count up from 385: 15 to 400, then 200 to 600. 15 + 200 = 215.",
 "2-10":"Add within 1,000 with any strategy that works for you: partial sums, adjusting, or the standard algorithm — and check with an estimate.",
 "2-11":"Subtract within 1,000 with decomposing, adjusting, or counting up — and check that your answer is close to your estimate.",
 "2-12":"Two-step problems need two operations. Find the hidden question first. 'Ama had 250 beads, used 75, then bought 120' → 250 − 75 = 175, then 175 + 120 = 295.",
 "3-1":"Equal groups have the same number in each group. 3 groups of 4 is 4 + 4 + 4 = 12, written 3 × 4 = 12.",
 "3-2":"An array has equal rows and columns. 4 rows of 5 dots shows 4 × 5 = 20.",
 "3-3":"Commutative property of multiplication: 4 × 5 = 5 × 4. Turn an array on its side and the total does not change.",
 "3-4":"Equal sharing: 12 cookies shared by 4 friends — deal them out. 12 ÷ 4 = 3 in each group.",
 "3-5":"Equal grouping: 12 cookies, 3 on each plate — how many plates? 12 ÷ 3 = 4 groups.",
 "3-6":"Arrays connect multiplication and division. 4 × 5 = 20, so 20 ÷ 4 = 5 and 20 ÷ 5 = 4. These are related facts.",
 "3-7":"A missing number is the unknown. 6 × ? = 42 — think 42 ÷ 6. ? ÷ 3 = 5 — think 5 × 3.",
 "4-1":"Multiplying by 2 is doubling: 2 × 7 = 7 + 7 = 14. Products of 2 are always even.",
 "4-2":"Multiplying by 5: skip-count 5, 10, 15, 20… Products of 5 end in 0 or 5.",
 "4-3":"Multiplying by 10: the product is the other factor with a zero at the end. 10 × 7 = 70.",
 "4-4":"Any number times 1 is that number (identity). Any number times 0 is 0 (zero property).",
 "4-5":"Use what you know: doubles for 2s, skip-counting for 5s, add a zero for 10s, and the 0 and 1 rules. Practice until they are automatic.",
 "4-6":"To solve an equal-groups problem, decide: how many groups, and how many in each? Then multiply. Draw a picture if it helps.",
 "5-1":"Distributive property: break one factor apart, multiply each part, then add. 8 × 6 = 8 × 3 + 8 × 3 = 24 + 24 = 48.",
 "5-2":"Multiply by 3 with a known fact plus one more group: 3 × 7 = 2 × 7 + 7 = 14 + 7 = 21.",
 "5-3":"Multiply by 4 by doubling twice: 4 × 6 = double 6 (12), then double again (24).",
 "5-4":"Multiply by 6 using 5s: 6 × 7 = 5 × 7 + 7 = 35 + 7 = 42. Or double a 3s fact.",
 "5-5":"Multiply by 8 by doubling a 4s fact: 8 × 7 = 4 × 7 doubled = 28 + 28 = 56.",
 "5-6":"Multiply by 7 by adding a 5s fact and a 2s fact: 7 × 6 = 30 + 12 = 42. Multiply by 9 with a 10s fact minus one group: 9 × 6 = 60 − 6 = 54.",
 "5-7":"Arrays solve real problems: 6 rows of chairs with 8 in each row is 6 × 8 = 48 chairs.",
 "6-1":"Area is the number of unit squares that cover a flat shape with no gaps or overlaps.",
 "6-2":"Count the unit squares inside the shape. Counting row by row keeps you from missing any.",
 "6-3":"Area of a rectangle = number of rows × number of columns = length × width. 4 rows of 6 squares = 24 square units.",
 "6-4":"A composite figure is made of rectangles. Split it, find each area, and add.",
 "6-5":"Split a rectangle into two smaller rectangles: 6 × 9 = 6 × 5 + 6 × 4 = 30 + 24 = 54. That is the distributive property with area.",
 "6-6":"Area word problems: decide what the length and width are, multiply, and label the answer in square units.",
 "7-1":"Partition means split into EQUAL parts. 4 equal parts are fourths; 3 equal parts are thirds. Equal parts must be the same size.",
 "7-2":"A fraction names part of a whole. The denominator (bottom) tells how many equal parts; the numerator (top) tells how many are counted. 3 of 4 parts shaded is 3/4.",
 "7-3":"On a number line from 0 to 1, cut the space into equal parts. With 4 parts, each tick is 1/4: 1/4, 2/4, 3/4, 4/4.",
 "7-4":"One whole can be written as a fraction where the top and bottom are the same: 4/4 = 1, 3/3 = 1.",

 "7-6":"Fractions can be greater than 1. Keep counting past 1: 4/4, 5/4, 6/4. 5/4 is 1 and 1/4.",
 "8-1":"Equivalent fractions name the same amount with different parts: 1/2 = 2/4 = 4/8.",

 "8-6":"Same numerator: the same number of pieces, so the SMALLER denominator (bigger pieces) is bigger. 2/3 > 2/5.",

 "9-1":"Division is a missing-factor problem. 24 ÷ 6 = ? means 6 × ? = 24. Since 6 × 4 = 24, the answer is 4.",

 "9-3":"Divide by 5: count by 5s to the dividend. Divide by 10: drop the zero. 70 ÷ 10 = 7.",

 "9-6":"Divide by 4 by halving twice: 32 ÷ 4 → 16 → 8. Divide by 8 by halving three times.",
 "9-7":"Divide by 9 with the 9s facts: 63 ÷ 9 = 7 because 9 × 7 = 63.",
 "9-8":"Divide by 7 with the 7s facts: 56 ÷ 7 = 8 because 7 × 8 = 56.",
 "9-9":"Fluent means fast AND accurate. Use the strategies you know and check with the related fact.",
 "10-1":"Multiples of 10: 3 × 40 = 3 × 4 tens = 12 tens = 120. Multiply the basic fact, then add the zero.",
 "10-2":"Patterns: an even factor gives an even product. Products of 9 have digits that add to 9. Products of 5 end in 0 or 5.",
 "10-3":"Associative property: grouping does not change the product. (2 × 3) × 5 = 2 × (3 × 5) = 30. Group to make easy numbers.",
 "10-4":"Two-step problems with multiplication and division: find the hidden question first. '4 packs of 6, shared by 3' → 4 × 6 = 24, then 24 ÷ 3 = 8.",
 "10-5":"Two-step problems can mix any operations. Write an equation for each step and label what each number means.",
 "10-6":"Check reasonableness by estimating or by using the inverse operation. If 7 × 8 gives 15, that cannot be right — 7 × 8 is close to 7 × 10 = 70.",
 "11-1":"Perimeter is the distance around a shape. Add the lengths of ALL the sides.",
 "11-2":"Find the perimeter of any figure by adding every side. A rectangle has two pairs of equal sides: 2 × length + 2 × width.",
 "11-3":"If you know the perimeter and all sides but one, subtract the known sides from the perimeter to find the missing side.",
 "11-4":"Area counts the squares inside; perimeter measures around. Two rectangles can share a perimeter but have different areas.",
 "11-5":"Measurement problems use length, area or perimeter in real situations — fences (perimeter), carpet (area), string (length).",
 "12-1":"Liquid volume is measured in milliliters (mL) for small amounts (a spoon is about 5 mL) and liters (L) for big ones (a large bottle is 2 L).",
 "12-2":"Estimate first, then add, subtract, multiply or divide the volumes. Keep the same unit.",

 "12-4":"Estimate a mass, then solve. 4 apples at 150 g each is 4 × 150 = 600 g.",

 "12-9":"Use the graph to answer 'how many more' and 'how many in all' questions — read carefully, then add or subtract.",
 "12-10":"A ruler can be marked in halves and fourths of an inch. Line up the object at 0 and read the closest mark.",
 "12-11":"A line plot shows measurement data with an X above each value on a number line. Count the Xs.",

/* ---------- visual helpers (book-style representations) ---------- */
function rvDots(rows,cols,ch){return '<div class="rv-array">'+Array(rows).fill(0).map(()=>'<div>'+Array(cols).fill(ch||"●").join("")+'</div>').join("")+'</div>';}
function rvGroups(groups,each,ch){return '<div class="rv-groups">'+Array(groups).fill(0).map(()=>'<span class="rv-group">'+Array(each).fill(ch||"🍪").join("")+'</span>').join("")+'</div>';}
function rvBlocks(n){const th=Math.floor(n/1000),h=Math.floor(n/100)%10,t=Math.floor(n/10)%10,o=n%10;
  return '<div class="rv-blocks">'+Array(th).fill('<span class="rv-th">1,000</span>').join("")+Array(h).fill('<span class="rv-h">100</span>').join("")+Array(t).fill('<span class="rv-t">10</span>').join("")+Array(o).fill('<span class="rv-o"></span>').join("")+'</div>';}
function rvNumberLine(a,b,step,mark,labels){const w=560,ticks=[];for(let v=a;v<=b;v+=step){const x=20+(v-a)/(b-a)*(w-40);ticks.push('<line x1="'+x+'" y1="30" x2="'+x+'" y2="50" stroke="#1f3c70" stroke-width="2"/>'+((labels?labels(v):v)!==null?'<text x="'+x+'" y="70" text-anchor="middle" font-size="14" fill="#1f3c70">'+(labels?labels(v):v)+'</text>':''));}
  const mx=mark==null?null:20+(mark-a)/(b-a)*(w-40);
  return '<svg class="rv-svg" viewBox="0 0 '+w+' 80"><line x1="10" y1="40" x2="'+(w-10)+'" y2="40" stroke="#1f3c70" stroke-width="3"/>'+ticks.join("")+(mx!=null?'<circle cx="'+mx+'" cy="40" r="7" fill="#f5a623" stroke="#1f3c70" stroke-width="2"/>':'')+'</svg>';}
function rvBar(parts,shaded,color){return '<div class="rv-bar">'+Array(parts).fill(0).map((_,i)=>'<span style="background:'+(i<shaded?(color||"#f5a623"):"#fff")+'"></span>').join("")+'</div>';}
function rvGrid(rows,cols,opts){opts=opts||{};const cell=26,w=cols*cell,h=rows*cell;let r='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(opts.skip&&opts.skip(x,y))continue;r+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+(opts.fill?opts.fill(x,y):"#ffe6a8")+'" stroke="#1f3c70"/>';}
  return '<svg class="rv-svg" viewBox="-2 -2 '+(w+4)+' '+(h+4)+'" style="max-width:'+(w+4)*1.4+'px">'+r+'</svg>';}
function rvRect(wLabel,hLabel){return '<svg class="rv-svg" viewBox="0 0 300 160" style="max-width:320px"><rect x="40" y="20" width="220" height="110" fill="#ffe6a8" stroke="#1f3c70" stroke-width="3"/><text x="150" y="150" text-anchor="middle" font-size="18" fill="#1f3c70">'+wLabel+'</text><text x="20" y="80" text-anchor="middle" font-size="18" fill="#1f3c70">'+hLabel+'</text></svg>';}
function rvClock(h,m){const cx=80,cy=80,r=70;let t='';for(let i=1;i<=12;i++){const a=i/6*Math.PI;t+='<text x="'+(cx+Math.sin(a)*56)+'" y="'+(cy-Math.cos(a)*56+5)+'" text-anchor="middle" font-size="14" fill="#1f3c70">'+i+'</text>';}
  for(let i=0;i<60;i++){const a=i/30*Math.PI,len=i%5?3:7;t+='<line x1="'+(cx+Math.sin(a)*(r-len))+'" y1="'+(cy-Math.cos(a)*(r-len))+'" x2="'+(cx+Math.sin(a)*r)+'" y2="'+(cy-Math.cos(a)*r)+'" stroke="#1f3c70" stroke-width="'+(i%5?1:2)+'"/>';}
  const ha=((h%12)+m/60)/6*Math.PI,ma=m/30*Math.PI;
  return '<svg class="rv-svg" viewBox="0 0 160 160" style="max-width:200px"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#1f3c70" stroke-width="3"/>'+t+'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.sin(ha)*36)+'" y2="'+(cy-Math.cos(ha)*36)+'" stroke="#1f3c70" stroke-width="5" stroke-linecap="round"/><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.sin(ma)*54)+'" y2="'+(cy-Math.cos(ma)*54)+'" stroke="#e0512f" stroke-width="3" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#1f3c70"/></svg>';}
function rvRuler(inches,objLen){const u=90,w=inches*u+40;let t='';for(let i=0;i<=inches*4;i++){const x=20+i*u/4,len=i%4===0?26:(i%2===0?18:11);t+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="'+(40+len)+'" stroke="#1f3c70" stroke-width="'+(i%4===0?2:1)+'"/>'+(i%4===0?'<text x="'+x+'" y="82" text-anchor="middle" font-size="14" fill="#1f3c70">'+(i/4)+'</text>':'');}
  return '<svg class="rv-svg" viewBox="0 0 '+w+' 90" style="max-width:'+w*1.3+'px"><rect x="20" y="8" width="'+(objLen*u)+'" height="22" rx="6" fill="#f5a623" stroke="#1f3c70" stroke-width="2"/><rect x="10" y="38" width="'+(w-20)+'" height="46" fill="#fff" stroke="#1f3c70" stroke-width="2"/>'+t+'</svg>';}
function rvPolygon(n,size){const cx=70,cy=70,r=55;const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2;pts.push((cx+Math.cos(a)*r).toFixed(1)+","+(cy+Math.sin(a)*r).toFixed(1));}
  return '<svg class="rv-svg" viewBox="0 0 140 140" style="max-width:'+(size||140)+'px"><polygon points="'+pts.join(" ")+'" fill="#ffe6a8" stroke="#1f3c70" stroke-width="3"/></svg>';}
const RV_QUADS={square:{n:"square",svg:'<polygon points="30,30 110,30 110,110 30,110"/>',d:"4 equal sides and 4 right angles"},rectangle:{n:"rectangle",svg:'<polygon points="15,40 125,40 125,100 15,100"/>',d:"4 right angles, opposite sides equal"},rhombus:{n:"rhombus",svg:'<polygon points="70,20 120,70 70,120 20,70"/>',d:"4 equal sides, no right angles needed"},trapezoid:{n:"trapezoid",svg:'<polygon points="40,40 100,40 125,100 15,100"/>',d:"exactly one pair of parallel sides"},parallelogram:{n:"parallelogram",svg:'<polygon points="35,40 125,40 105,100 15,100"/>',d:"two pairs of parallel sides, no right angles needed"}};
function rvQuad(k){return '<svg class="rv-svg" viewBox="0 0 140 140" style="max-width:150px"><g fill="#ffe6a8" stroke="#1f3c70" stroke-width="3">'+RV_QUADS[k].svg+'</g></svg>';}
function rvPicto(rows,key,icon){return '<table class="rv-table"><tr><th colspan="2">Key: each '+icon+' = '+key+'</th></tr>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+Array(r[1]).fill(icon).join(" ")+'</td></tr>').join("")+'</table>';}

 compare(L){const mode=(L.p||["any"])[0];let a,b,c,d;if(mode==="den"){d=b=pick([4,6,8]);a=1+rnd(b-1);do{c=1+rnd(b-1)}while(c===a);}else if(mode==="num"){a=c=pick([1,2,3]);b=pick([3,4,6,8]);do{d=pick([3,4,6,8])}while(d===b);}else{const P=[[1,2,1,3],[3,4,1,2],[2,3,2,6],[1,4,1,8],[5,6,5,8],[2,4,1,2],[3,8,3,4]];const p=pick(P);[a,b,c,d]=rnd(2)?p:[p[2],p[3],p[0],p[1]];}

 div10(){const n=1+rnd(9);const k=rnd(3);if(k===0)return{q:n+" ÷ 1 = ?",...rvOpts(n,3),teach:[{i:"1️⃣",t:"Dividing by 1 makes 1 group of everything."},{i:"✅",t:"1 × "+n+" = "+n+"."},{i:"🎯",t:n+" ÷ 1 = "+n+"."}]};

 fluent(){const a=2+rnd(8),b=2+rnd(8);const k=rnd(2);if(k===0)return{q:a+" × "+b+" = ?",...rvOpts(a*b,6),teach:[{i:"💡",t:"Use the strategy you like best for "+a+"s."},{i:"🔁",t:"Check with the flipped fact "+b+" × "+a+"."},{i:"🎯",t:a+" × "+b+" = "+(a*b)+"."}]};return{q:(a*b)+" ÷ "+a+" = ?",...rvOpts(b,3),teach:[{i:"❓",t:a+" × ? = "+(a*b)+"."},{i:"✅",t:a+" × "+b+" = "+(a*b)+"."},{i:"🎯",t:(a*b)+" ÷ "+a+" = "+b+"."}]};},

 associative(){const a=2+rnd(3),b=2+rnd(4),c=pick([2,5,10]);const ans=a*b*c;const o=rvStrOpts(a+" × ("+b+" × "+c+")",["("+a+" + "+b+") × "+c,a+" × "+b+" + "+c,"("+a+" × "+c+") + "+b]);return{q:"Which expression equals ("+a+" × "+b+") × "+c+" by the associative property?",...o,teach:[{i:"🧩",t:"Change the grouping, keep the order."},{i:"✅",t:"("+a+" × "+b+") × "+c+" = "+(a*b)+" × "+c+" = "+ans+"; "+a+" × ("+b+" × "+c+") = "+a+" × "+(b*c)+" = "+ans+"."},{i:"🎯",t:"Same product either way."}]};},

<script>

const RACE_TRACKS=[
 {id:"nebula",name:"Rainbow Nebula",laps:3,space:true,sky:["#05021a","#2a0a5e","#0b1f5c"],grass:["#120a33","#0c0724"],rainbow:true,city:true,

 {id:"skybridge",name:"Sky Bridge Kumasi",laps:2,space:true,sky:["#020617","#0b3d91","#38bdf8"],grass:["#0a1a3a","#07132c"],rainbow:true,city:false,

function startRace2D(tid){
  raceStop();clearTimers();closeOverlay();showAnanseCorner(false);
  const T=RACE_TRACKS.find(t=>t.id===tid)||RACE_TRACKS[0];
  app.innerHTML='<div class="fadein race-wrap">'
   +'<canvas id="rcCanvas" width="720" height="440"></canvas>'
   +'<div class="race-ctl"><button class="race-btn" id="rcL">◀</button><button class="race-btn" id="rcB">🛑</button><button class="race-btn gp-fire" id="rcF">⚡</button><button class="race-btn" id="rcR">▶</button></div>'
   +'<div class="center" style="margin-top:8px"><button class="readbtn" onclick="renderRace2D()">⟵ Quit race</button></div></div>';
  const c=$("rcCanvas");
  const SEG=200,RW=2200;const segs=[];
  T.curves.forEach(([n,curve])=>{for(let i=0;i<n;i++){const t=i/n;const ease=curve*(t<0.25?t*4:(t>0.75?(1-t)*4:1));segs.push({curve:ease,sprites:[]});}});
  const N=segs.length,LEN=N*SEG;
  const rnd2=n=>Math.floor(Math.random()*n);
  const deco=T.space?["🪐","✨","🛰️","🌠","💫","🛸"]:["🏙️","🌴","🏢","🎆","🌴","🏬"];
  for(let i=0;i<N;i+=4){const side=i%8<4?-1:1;segs[i].sprites.push({e:deco[rnd2(deco.length)],off:side*(1.7+Math.random()*0.9),size:1});if(i%40===0)segs[i].sprites.push({e:"🇬🇭",off:-side*1.6,size:.8});}

  const items=[];for(let i=25;i<N;i+=9){items.push({z:i*SEG+rnd2(SEG),x:(rnd2(3)-1)*0.55,kind:"box",alive:true});}
  for(let i=15;i<N;i+=23){items.push({z:i*SEG,x:(rnd2(3)-1)*0.55,kind:"banana",alive:true});}
  // stars for the space sky
  const stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*0.55,r:Math.random()*1.8+0.4,tw:Math.random()*6});
  const cars=RACE_RIVALS.map((r,i)=>({name:r.n,e:r.e,c:r.c,z:(i+1)*SEG*3,x:(i%2?0.45:-0.45),speed:0,max:11700+i*500+rnd2(500),lap:0,total:0,spin:0,slow:0,wobble:Math.random()*6,fireIn:6+Math.random()*8}));
  RC={T,segs,N,LEN,SEG,RW,items,cars,stars,shots:[],place:5,board:[{name:"Kofi"},{name:"Ama"},{name:"Esi"},{name:"Kwame"},{name:"You"}],player:{z:0,x:0,speed:0,max:13000,lap:0,total:0,spin:0,boost:0,shield:0,item:null,coins:0},keys:{},t0:performance.now(),time:0,done:false,raf:null,cam:{h:1000,depth:1/Math.tan((80/2)*Math.PI/180)},last:performance.now(),touchDir:0,brake:false,flash:0,msg:"",msgT:0,hue:0};
  RC.kd=e=>{if(!RC)return;const k=e.key.toLowerCase();if(k==="escape"){renderRace2D();return;}if(k===" "||k==="arrowup"){raceUseItem();e.preventDefault();return;}RC.keys[k]=true;if(["arrowleft","arrowright","arrowdown"].includes(k))e.preventDefault();};
  RC.ku=e=>{if(!RC)return;RC.keys[e.key.toLowerCase()]=false;};
  window.addEventListener("keydown",RC.kd);window.addEventListener("keyup",RC.ku);
  const hold=(id,dir)=>{const b=$(id);const on=ev=>{ev.preventDefault();if(!RC)return;if(dir==="b")RC.brake=true;else RC.touchDir=dir;};const off=ev=>{ev.preventDefault();if(!RC)return;if(dir==="b")RC.brake=false;else if(RC.touchDir===dir)RC.touchDir=0;};["pointerdown","touchstart"].forEach(t=>b.addEventListener(t,on,{passive:false}));["pointerup","pointerleave","pointercancel","touchend"].forEach(t=>b.addEventListener(t,off));};
  hold("rcL",-1);hold("rcR",1);hold("rcB","b");
  $("rcF").addEventListener("pointerdown",ev=>{ev.preventDefault();raceUseItem();});
  c.addEventListener("pointerdown",ev=>{if(!RC)return;const r=c.getBoundingClientRect();RC.touchDir=(ev.clientX-r.left)<r.width/2?-1:1;});
  ["pointerup","pointerleave","pointercancel"].forEach(t=>c.addEventListener(t,()=>{if(RC)RC.touchDir=0;}));
  say("Grand Fable GP. Three, two, one, go!");
  RC.countdown=3.2;
  RC.raf=requestAnimationFrame(raceFrame);
}
function raceSay(m){if(!RC)return;RC.msg=m;RC.msgT=1.6;}
function raceUseItem(){
  if(!RC||RC.done||RC.countdown>0)return;const p=RC.player;if(!p.item)return;
  const it=p.item;p.item=null;
  if(it==="rocket"){p.boost=3;sfx("levelup");raceSay("🚀 Rocket boost!");}
  else if(it==="shield"){p.shield=8;sfx("tick");raceSay("🛡️ Shield up!");}
  else if(it==="banana"){RC.items.push({z:(p.z-RC.SEG*1.5+RC.LEN)%RC.LEN,x:p.x,kind:"banana",alive:true,dropped:true});sfx("tick");raceSay("🍌 Banana dropped!");}
  else if(it==="orb"){RC.shots.push({z:p.z,x:p.x,speed:p.speed+9000,from:"player",life:4});sfx("correct");raceSay("🌀 Homing orb away!");}
}
function raceFrame(now){
  if(!RC)return;
  const dt=Math.min(0.05,(now-RC.last)/1000);RC.last=now;
  RC.hue=(RC.hue+dt*40)%360;
  if(RC.countdown>0){RC.countdown-=dt;raceDraw();RC.raf=requestAnimationFrame(raceFrame);return;}
  if(!RC.done)RC.time=now-RC.t0-3200;
  raceUpdate(dt);raceDraw();
  RC.raf=requestAnimationFrame(raceFrame);
}
function raceHit(target,cause){
  if(target==="player"){const p=RC.player;if(p.shield>0){p.shield=0;sfx("tick");raceSay("🛡️ Shield blocked it!");return;}p.spin=1.1;p.boost=0;sfx("wrong");raceSay(cause==="orb"?"🌀 Hit by an orb!":"🍌 Banana spin!");}
  else{target.spin=1.2;}
}
function raceUpdate(dt){
  const p=RC.player,k=RC.keys;
  const left=k["arrowleft"]||k["a"]||RC.touchDir<0,right=k["arrowright"]||k["d"]||RC.touchDir>0,brake=k["arrowdown"]||k["s"]||RC.brake;
  const seg=RC.segs[Math.floor(p.z/RC.SEG)%RC.N];
  const maxNow=p.max*(p.boost>0?1.4:1)*(p.spin>0?0.3:1)*(Math.abs(p.x)>1?0.5:1);
  if(brake)p.speed=Math.max(0,p.speed-16000*dt);else p.speed+=(maxNow-p.speed)*Math.min(1,dt*1.4);
  if(Math.abs(p.x)>1)p.speed=Math.min(p.speed,maxNow);
  const spd=p.speed/p.max;
  if(p.spin>0){p.spin-=dt;p.x+=Math.sin(p.spin*20)*dt*0.5;}
  else{if(left)p.x-=dt*2.3*Math.max(.4,spd);if(right)p.x+=dt*2.3*Math.max(.4,spd);}
  p.x-=seg.curve*spd*dt*0.9;
  p.x=Math.max(-1.6,Math.min(1.6,p.x));
  if(p.boost>0)p.boost-=dt;if(p.shield>0)p.shield-=dt;if(RC.msgT>0)RC.msgT-=dt;if(RC.flash>0)RC.flash-=dt;
  const dz=p.speed*dt;p.z+=dz;p.total+=dz;
  if(p.z>=RC.LEN){p.z-=RC.LEN;p.lap++;if(p.lap>=RC.T.laps&&!RC.done)raceFinish();else{sfx("tick");raceSay(p.lap+1===RC.T.laps?"🏁 Final lap!":"Lap "+(p.lap+1)+"!");}}
  // items & boxes
  RC.items.forEach(it=>{if(!it.alive)return;const d=(it.z-p.z+RC.LEN)%RC.LEN;if(d<RC.SEG*0.6&&Math.abs(it.x-p.x)<0.35){
    if(it.kind==="box"){it.alive=false;setTimeout(()=>{it.alive=true;},7000);if(!p.item){const pool=RC.place>=4?["rocket","rocket","orb","shield"]:(RC.place===1?["banana","shield","orb","rocket"]:["rocket","orb","shield","banana"]);p.item=pool[Math.floor(Math.random()*pool.length)];RC.flash=0.5;sfx("correct");raceSay("🎁 "+RACE_ITEMS[p.item].n+"!");}p.coins++;}
    else if(it.kind==="banana"){it.alive=false;if(!it.dropped)setTimeout(()=>{it.alive=true;},9000);raceHit("player","banana");}
  }});
  // homing orbs
  RC.shots=RC.shots.filter(s=>{s.life-=dt;s.z=(s.z+s.speed*dt)%RC.LEN;
    if(s.from==="player"){let best=null,bd=1e9;RC.cars.forEach(car=>{const d=(car.z-s.z+RC.LEN)%RC.LEN;if(d<RC.SEG*40&&d<bd){bd=d;best=car;}});if(best){s.x+=(best.x-s.x)*dt*4;if(bd<RC.SEG*0.8&&Math.abs(best.x-s.x)<0.4){raceHit(best);sfx("correct");raceSay("🌀 Got "+best.name+"!");return false;}}}
    else{const d=(p.z-s.z+RC.LEN)%RC.LEN;s.x+=(p.x-s.x)*dt*3;if(d<RC.SEG*0.8&&Math.abs(p.x-s.x)<0.4){raceHit("player","orb");return false;}}
    return s.life>0;});

  RC.cars.forEach(car=>{
    const cmax=car.max*(car.spin>0?0.3:1);
    car.speed+=(cmax-car.speed)*Math.min(1,dt*1.2);
    if(car.spin>0)car.spin-=dt;
    car.wobble+=dt;const target=Math.sin(car.wobble*0.6)*0.55;car.x+=(target-car.x)*dt*1.2;
    const gap=(p.z-car.z+RC.LEN)%RC.LEN;if(gap<RC.SEG*3&&gap>0&&Math.abs(car.x-p.x)<0.3)car.x+=(car.x<p.x?-1:1)*dt*1.5;
    // rivals fire orbs at the player now and then when they are behind
    car.fireIn-=dt;if(car.fireIn<=0){car.fireIn=9+Math.random()*10;const behind=(p.z-car.z+RC.LEN)%RC.LEN;if(behind>RC.SEG&&behind<RC.SEG*30&&!RC.done){RC.shots.push({z:car.z,x:car.x,speed:car.speed+8000,from:car.name,life:4});raceSay("⚠️ "+car.name+" fired an orb!");}}
    // rivals hit bananas too
    RC.items.forEach(it=>{if(it.alive&&it.kind==="banana"){const d=(it.z-car.z+RC.LEN)%RC.LEN;if(d<RC.SEG*0.5&&Math.abs(it.x-car.x)<0.3&&car.spin<=0){raceHit(car);if(it.dropped)it.alive=false;}}});
    const cz=car.speed*dt;car.z+=cz;car.total+=cz;if(car.z>=RC.LEN){car.z-=RC.LEN;car.lap++;}
    const d=(car.z-p.z+RC.LEN)%RC.LEN;
    if(d<RC.SEG*0.7&&Math.abs(car.x-p.x)<0.4&&p.speed>car.speed){p.speed=car.speed*0.85;p.x+=(p.x<car.x?-1:1)*0.25;sfx("tick");}
  });

  RC.board=all;RC.place=all.findIndex(a=>a.name==="You")+1;
}
function raceProject(px,py,pz,camX,camY,camZ,W,H){
  const dz=pz-camZ;const scale=RC.cam.depth/Math.max(1,dz);
  return{x:Math.round(W/2+scale*(px-camX)*W/2),y:Math.round(H/2-scale*(py-camY)*H/2),w:Math.round(scale*RC.RW*W/2),scale};
}
function racePoly(x,x1,y1,x2,y2,x3,y3,x4,y4){x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.lineTo(x3,y3);x.lineTo(x4,y4);x.closePath();x.fill();}
function raceSkyline(x,W,H,shift,hue){
  x.save();x.globalAlpha=0.9;
  for(let i=0;i<26;i++){const bw=18+((i*37)%40),bh=40+((i*53)%120);const bx=((i*61+shift*0.15)%(W+120))-60;const by=H*0.5-bh;
    x.fillStyle="rgba(10,6,40,.95)";x.fillRect(bx,by,bw,bh);
    x.fillStyle="hsla("+((hue+i*40)%360)+",100%,65%,.8)";for(let wy=by+6;wy<H*0.5-6;wy+=10)for(let wx=bx+4;wx<bx+bw-4;wx+=8)if((wx*7+wy*3+i)%5<2)x.fillRect(wx,wy,3,5);
    x.fillStyle="hsla("+((hue+i*40)%360)+",100%,60%,.9)";x.fillRect(bx,by,bw,2);}
  x.restore();
}
function raceDraw(){
  const c=$("rcCanvas");if(!c)return;const x=c.getContext("2d"),W=c.width,H=c.height,p=RC.player,T=RC.T;
  // sky / galaxy
  const g=x.createLinearGradient(0,0,0,H*0.55);g.addColorStop(0,T.sky[0]);g.addColorStop(0.6,T.sky[1]);g.addColorStop(1,T.sky[2]);x.fillStyle=g;x.fillRect(0,0,W,H*0.55);
  if(T.space){const neb=x.createRadialGradient(W*0.7,H*0.15,10,W*0.7,H*0.15,W*0.5);neb.addColorStop(0,"rgba(255,80,200,.35)");neb.addColorStop(0.5,"rgba(80,60,255,.18)");neb.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=neb;x.fillRect(0,0,W,H*0.55);
    RC.stars.forEach(s=>{const tw=0.5+0.5*Math.sin(RC.hue/10+s.tw);x.fillStyle="rgba(255,255,255,"+(0.4+0.6*tw)+")";x.beginPath();x.arc(((s.x*W)-(p.x*30)+W)%W,s.y*H,s.r,0,7);x.fill();});
    x.font="26px system-ui";x.fillText("🪐",W*0.82-p.x*20,H*0.12);x.font="18px system-ui";x.fillText("🌙",W*0.15-p.x*15,H*0.1);}
  if(T.city)raceSkyline(x,W,H,p.z/40+p.x*60,RC.hue);
  // ground glow line
  x.fillStyle="hsla("+RC.hue+",100%,60%,.6)";x.fillRect(0,H*0.55-2,W,3);
  const baseIdx=Math.floor(p.z/RC.SEG);const basePct=(p.z%RC.SEG)/RC.SEG;
  const camX=p.x*RC.RW,camY=RC.cam.h,camZ=p.z;
  let maxY=H,dx=-(RC.segs[baseIdx%RC.N].curve*basePct),xoff=0;
  const sprites=[];
  for(let n=0;n<110;n++){
    const idx=(baseIdx+n)%RC.N,seg=RC.segs[idx];
    const z1=(baseIdx+n)*RC.SEG,z2=z1+RC.SEG;
    const p1=raceProject(xoff,0,z1,camX,camY,camZ,W,H);
    xoff+=dx;dx+=seg.curve;
    const p2=raceProject(xoff,0,z2,camX,camY,camZ,W,H);
    if(p2.y<maxY&&p1.y>p2.y){
      const dark=Math.floor((baseIdx+n)/3)%2;
      x.fillStyle=T.grass[dark];x.fillRect(0,p2.y,W,p1.y-p2.y);
      const rumble=w=>w*1.12;
      x.fillStyle=dark?"hsl("+((RC.hue+idx*6)%360)+",100%,60%)":"#fff";racePoly(x,p1.x-rumble(p1.w),p1.y,p1.x+rumble(p1.w),p1.y,p2.x+rumble(p2.w),p2.y,p2.x-rumble(p2.w),p2.y);
      if(T.rainbow){const hue=(idx*9+RC.hue)%360;x.fillStyle="hsl("+hue+",90%,"+(dark?"52%":"58%")+")";}
      else x.fillStyle=T.road[dark];
      racePoly(x,p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y);
      if(T.rainbow){x.fillStyle="rgba(255,255,255,.12)";for(let b=1;b<6;b++){const bx1=p1.x-p1.w+p1.w*2*b/6,bx2=p2.x-p2.w+p2.w*2*b/6;racePoly(x,bx1-1,p1.y,bx1+1,p1.y,bx2+1,p2.y,bx2-1,p2.y);}}
      else if(dark){x.fillStyle="rgba(120,230,255,.75)";for(let l=1;l<3;l++){const lw1=p1.w*0.02,lw2=p2.w*0.02;const lx1=p1.x-p1.w+p1.w*2*l/3,lx2=p2.x-p2.w+p2.w*2*l/3;racePoly(x,lx1-lw1,p1.y,lx1+lw1,p1.y,lx2+lw2,p2.y,lx2-lw2,p2.y);}}
      if(idx===0){x.fillStyle="#fff";racePoly(x,p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y);x.fillStyle="#111";for(let k=0;k<8;k++)if(k%2)x.fillRect(p1.x-p1.w+(p1.w*2)*k/8,p2.y,(p1.w*2)/8,Math.max(1,p1.y-p2.y));}
      maxY=p2.y;
    }
    seg.sprites.forEach(s=>sprites.push({e:s.e,x:p1.x+p1.w*s.off,y:p1.y,s:p1.scale*RC.RW*W/2*0.5*s.size,d:n}));
    RC.items.forEach(it=>{if(it.alive&&Math.floor(it.z/RC.SEG)===idx)sprites.push({item:it,x:p1.x+p1.w*it.x,y:p1.y,s:p1.scale*RC.RW*W/2*0.38,d:n});});
    RC.shots.forEach(s=>{if(Math.floor(s.z/RC.SEG)===idx)sprites.push({e:"🌀",x:p1.x+p1.w*s.x,y:p1.y-p1.scale*RC.RW*W/2*0.1,s:p1.scale*RC.RW*W/2*0.3,d:n});});
    RC.cars.forEach(car=>{if(Math.floor(car.z/RC.SEG)===idx)sprites.push({car,x:p1.x+p1.w*car.x,y:p1.y,s:p1.scale*RC.RW*W/2*0.5,d:n});});
  }
  sprites.sort((a,b)=>b.d-a.d).forEach(s=>{
    const size=Math.max(6,Math.min(150,s.s));
    if(s.car)raceKart(x,s.x,s.y,size,s.car.c,s.car.e,false,s.car.spin>0);
    else if(s.item){if(s.item.kind==="box")raceBox(x,s.x,s.y,size);else{x.font=size+"px system-ui";x.textAlign="center";x.fillText("🍌",s.x,s.y);x.textAlign="left";}}
    else{x.font=size+"px system-ui";x.textAlign="center";x.fillText(s.e,s.x,s.y);x.textAlign="left";}
  });
  // speed lines when boosting
  if(p.boost>0){x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=2;for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2+RC.hue/20;x.beginPath();x.moveTo(W/2+Math.cos(a)*120,H*0.7+Math.sin(a)*60);x.lineTo(W/2+Math.cos(a)*W,H*0.7+Math.sin(a)*H);x.stroke();}}
  // player kart
  raceKart(x,W/2+(p.spin>0?Math.sin(p.spin*30)*10:0),H-16,120,"#f5a623","🦁",p.boost>0,p.spin>0,true);
  if(p.shield>0){x.strokeStyle="rgba(120,230,255,"+(0.5+0.4*Math.sin(RC.hue/5))+")";x.lineWidth=4;x.beginPath();x.ellipse(W/2,H-50,80,46,0,0,7);x.stroke();}
  // HUD: holographic panels
  raceHud(x,W,H);
  if(RC.countdown>0){x.fillStyle="rgba(0,0,0,.35)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.font="900 96px system-ui";x.textAlign="center";x.shadowColor="hsl("+RC.hue+",100%,60%)";x.shadowBlur=30;const n=Math.ceil(RC.countdown-0.2);x.fillText(n>0?String(n):"GO!",W/2,H/2+34);x.shadowBlur=0;x.textAlign="left";}
  if(RC.done){x.fillStyle="rgba(0,0,0,.5)";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#fff";x.shadowColor="hsl("+RC.hue+",100%,60%)";x.shadowBlur=26;x.font="900 46px system-ui";x.fillText("🏁 "+raceOrdinal(RC.place)+" PLACE",W/2,H/2-6);x.shadowBlur=0;x.font="700 22px system-ui";x.fillText(raceFmt(RC.time)+" · 🎁 "+p.coins+" boxes"+(RC.xp?" · +"+RC.xp+" XP":""),W/2,H/2+32);x.textAlign="left";}
}
function raceHud(x,W,H){
  const p=RC.player;
  const panel=(px,py,pw,ph)=>{x.fillStyle="rgba(5,10,40,.62)";x.beginPath();x.roundRect(px,py,pw,ph,10);x.fill();x.strokeStyle="hsla("+RC.hue+",100%,70%,.8)";x.lineWidth=1.5;x.stroke();};
  // leaderboard (top right)
  const rows=(RC.board||[]).slice(0,5);panel(W-172,10,162,22+rows.length*20);
  x.font="900 12px system-ui";x.fillStyle="#9fd0ff";x.fillText("LEADERBOARD",W-160,26);
  rows.forEach((r,i)=>{const you=r.name==="You";x.fillStyle=you?"#ffd166":"#fff";x.font=(you?"900":"700")+" 14px system-ui";x.fillText((i+1)+". "+(you?"ANANSE #7":r.name.toUpperCase()),W-160,44+i*20);});
  // race panel (top left)
  panel(10,10,210,62);
  x.fillStyle="#ffd166";x.font="900 20px system-ui";x.fillText(raceOrdinal(RC.place).toUpperCase(),22,34);
  x.fillStyle="#fff";x.font="700 13px system-ui";x.fillText("LAP "+Math.min(RC.T.laps,p.lap+1)+"/"+RC.T.laps+"   ⏱ "+raceFmt(Math.max(0,RC.time)),22,54);
  x.fillStyle="#9fd0ff";x.fillText(RC.T.name.toUpperCase(),22,68);
  // item slot (bottom left)
  panel(10,H-72,62,62);
  if(p.item){x.font="34px system-ui";x.textAlign="center";x.fillText(RACE_ITEMS[p.item].e,41,H-28);x.textAlign="left";x.fillStyle="#ffd166";x.font="900 10px system-ui";x.fillText("⚡ USE",24,H-14);}
  else{x.fillStyle="#9fd0ff";x.font="900 10px system-ui";x.fillText("ITEM",29,H-38);x.fillText("—",36,H-22);}
  // speedometer (bottom right)
  panel(W-96,H-72,86,62);x.fillStyle="#fff";x.font="900 22px system-ui";x.fillText(Math.round(p.speed/60),W-84,H-40);x.fillStyle="#9fd0ff";x.font="900 10px system-ui";x.fillText("KM/H"+(p.boost>0?" 🚀":""),W-84,H-22);
  if(RC.flash>0){x.fillStyle="rgba(255,255,255,"+RC.flash*0.4+")";x.fillRect(0,0,W,H);}
  if(RC.msgT>0){x.textAlign="center";x.fillStyle="#fff";x.font="900 24px system-ui";x.shadowColor="#000";x.shadowBlur=8;x.fillText(RC.msg,W/2,90);x.shadowBlur=0;x.textAlign="left";}
}
function raceBox(x,cx,by,size){
  const s=size*0.7,r=RC.hue/40;
  x.save();x.translate(cx,by-s*0.6);x.rotate(Math.sin(r)*0.4);
  x.shadowColor="hsl("+RC.hue+",100%,70%)";x.shadowBlur=size*0.4;
  x.fillStyle="hsla("+((RC.hue+180)%360)+",100%,60%,.55)";x.fillRect(-s/2,-s/2,s,s);
  x.strokeStyle="#fff";x.lineWidth=Math.max(1,size*0.04);x.strokeRect(-s/2,-s/2,s,s);
  x.shadowBlur=0;x.fillStyle="#fff";x.font="900 "+(s*0.7)+"px system-ui";x.textAlign="center";x.fillText("?",0,s*0.25);x.textAlign="left";x.restore();
}
function raceKart(x,cx,by,size,color,driver,flame,spinning,isPlayer){
  const w=size,h=size*0.55;
  x.save();x.translate(cx,by);if(spinning)x.rotate(Math.sin(RC.hue/3)*0.5);
  if(flame){x.font=(size*0.4)+"px system-ui";x.textAlign="center";x.fillText("🔥",-w*0.2,h*0.35);x.fillText("🔥",w*0.2,h*0.35);}
  x.shadowColor=color;x.shadowBlur=size*0.25;
  x.fillStyle="#0b0f2a";x.beginPath();x.roundRect(-w/2,-h*0.35,w*0.22,h*0.45,4);x.fill();x.beginPath();x.roundRect(w/2-w*0.22,-h*0.35,w*0.22,h*0.45,4);x.fill();
  x.fillStyle=color;x.beginPath();x.roundRect(-w*0.42,-h*0.78,w*0.84,h*0.62,Math.max(4,size*0.09));x.fill();
  x.shadowBlur=0;
  x.fillStyle="rgba(255,255,255,.3)";x.fillRect(-w*0.32,-h*0.72,w*0.64,h*0.1);
  x.strokeStyle="rgba(120,230,255,.9)";x.lineWidth=Math.max(1,size*0.02);x.strokeRect(-w*0.42,-h*0.78,w*0.84,h*0.62);
  if(isPlayer){x.fillStyle="#fff";x.font="900 "+(size*0.22)+"px system-ui";x.textAlign="center";x.fillText("7",0,-h*0.3);x.textAlign="left";}
  x.font=(size*0.42)+"px system-ui";x.textAlign="center";x.fillText(driver,0,-h*0.66);x.textAlign="left";
  x.restore();
}
function raceFinish(){
  RC.done=true;RC.player.speed*=0.5;
  const place=RC.place;const xp=[0,30,20,10,5,5][place]||5;RC.xp=P?xp:0;
  sfx(place===1?"levelup":"correct");if(place===1)confetti();
  say(place===1?"You win the Grand Fable GP! Champion of "+RC.T.name+"!":"You finished "+raceOrdinal(place)+". Great driving!");
  if(P){
    P.xp+=xp;P.race=P.race||{};const prev=P.race[RC.T.id];
    P.race[RC.T.id]={time:prev&&prev.time<RC.time?prev.time:RC.time,place:Math.min(place,prev?prev.place:9),date:today()};
    if(place===1&&!P.trophies.some(t=>t.type==="race")&&typeof awardTrophy==="function")awardTrophy({type:"race",icon:"🏎️",label:"Grand Fable Champion",color:"#ffd166",detail:"Won a race on "+RC.T.name+"."});
    save();
  }
  setTimeout(()=>{if(!RC)return;const wrap=document.querySelector(".race-wrap");if(wrap)wrap.insertAdjacentHTML("beforeend",'<div class="center fadein" style="margin-top:10px"><div class="btn-row"><button class="btn big" onclick="startRace2D(\''+RC.T.id+'\')">Race again 🔁</button><button class="btn secondary big" onclick="renderRace2D()">Circuits 🏁</button><button class="btn secondary big" onclick="'+(P?'renderHome()':'renderProfiles()')+'">Home 🏠</button></div></div>');},1200);
}

</script>
<script>
/* race3d.js is inlined here (Grand Fable GP, Three.js); edit race3d.js and run inline_lessons.py */

   GRAND FABLE GP — true 3D kart racing (Three.js), open any time

"use strict";
let R3=null;
const GP_RACERS=[
 {id:"ananse",n:"Ananse",e:"🦁",c:0xf5a623,css:"#f5a623",helmet:0xc9a84c,speed:4,handle:4,accel:4,bio:"The Wise Lion. Balanced, clever, never gives up."},
 {id:"kofi",n:"Kofi",e:"🐘",c:0xff4d6d,css:"#ff4d6d",helmet:0x8b1e3f,speed:5,handle:2,accel:2,bio:"Big engine, big heart. Slow to turn, fast on straights."},
 {id:"ama",n:"Ama",e:"🐆",c:0xb06bff,css:"#b06bff",helmet:0x5b2a9e,speed:5,handle:3,accel:4,bio:"Quick as a leopard. Top speed to burn."},
 {id:"esi",n:"Esi",e:"🦓",c:0x39e6a0,css:"#39e6a0",helmet:0x1b8f5e,speed:3,handle:5,accel:4,bio:"Hugs every corner. Best handling on the grid."},
 {id:"kwame",n:"Kwame",e:"🐊",c:0x4dd2ff,css:"#4dd2ff",helmet:0x1a6fa0,speed:4,handle:3,accel:5,bio:"Snappy starts. Launches off the line like a rocket."}
];
const GP_CIRCUITS=[
 {id:"palm",name:"Palm Cove Circuit",laps:3,tree:"palm",grass:0x58b85a,sky:0x8fd3ff,pts:[[0,0],[70,-8],[125,25],[135,85],[95,125],[30,118],[-35,140],[-95,105],[-115,45],[-70,-5]]},
 {id:"stadium",name:"Accra Stadium Loop",laps:3,tree:"round",grass:0x4faf52,sky:0x7cc4ff,pts:[[0,0],[90,0],[130,40],[110,95],[40,110],[-10,80],[-60,110],[-120,80],[-125,25],[-70,-10]]},
 {id:"hills",name:"Kumasi Hillside",laps:2,tree:"round",grass:0x6cae4a,sky:0xa9dcff,pts:[[0,0],[60,-20],[120,10],[140,70],[100,110],[60,80],[10,120],[-60,130],[-120,90],[-110,30],[-50,-15]]}
];
const GP_ITEMS={rocket:{e:"🚀",n:"Rocket boost"},orb:{e:"🌀",n:"Homing orb"},shield:{e:"🛡️",n:"Shield"},banana:{e:"🍌",n:"Banana"}};
function gpOrd(n){return n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);}
function gpFmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")+"."+String(Math.floor((ms%1000)/100));}

/* ---------- entry: racer select → circuit select → race ---------- */

function gpPickRacer(id){if(P){P.gpRacer=id;save();}else window._gpRacer=id;document.querySelectorAll(".gp-racer").forEach(b=>b.classList.toggle("on",b.getAttribute("onclick").indexOf("'"+id+"'")>0));sfx("tick");}

function renderCircuits(){

   +'<div class="card gp-card" style="margin-top:14px"><b>Controls</b><p class="muted" style="margin-top:6px">← → steer (A / D) · ↓ brake · Space or ↑ fires your item · Esc quits. Touch: hold the left or right side of the screen, ⚡ fires. 1st = 30 XP, 2nd = 20, 3rd = 10. Win once for the Grand Fable Champion trophy.</p></div>'
   +'<div class="btn-row" style="margin-top:12px"><button class="btn secondary" onclick="renderRace()">⟵ Racers</button></div><div class="spacer"></div></div>';

  R3={T,C,me,renderer,scene,camera,curve,samples,M,W,len,items,karts,shots:[],mkBanana,keys:{},touchDir:0,brake:false,t0:performance.now(),time:0,countdown:3.5,done:false,raf:null,last:performance.now(),camPos:new T.Vector3(),msgT:0,place:5,board:[]};
  R3.kd=e=>{if(!R3)return;const k=e.key.toLowerCase();if(k==="escape"){renderCircuits();return;}if(k===" "||k==="arrowup"){gpUseItem(R3.karts.find(x=>x.player));e.preventDefault();return;}R3.keys[k]=true;if(["arrowleft","arrowright","arrowdown"].includes(k))e.preventDefault();};
  R3.ku=e=>{if(!R3)return;R3.keys[e.key.toLowerCase()]=false;};
  window.addEventListener("keydown",R3.kd);window.addEventListener("keyup",R3.ku);
  const hold=(id,dir)=>{const b=$(id);if(!b)return;const on=ev=>{ev.preventDefault();if(!R3)return;if(dir==="b")R3.brake=true;else R3.touchDir=dir;};const off=ev=>{if(!R3)return;if(dir==="b")R3.brake=false;else if(R3.touchDir===dir)R3.touchDir=0;};["pointerdown","touchstart"].forEach(t=>b.addEventListener(t,on,{passive:false}));["pointerup","pointerleave","pointercancel","touchend"].forEach(t=>b.addEventListener(t,off));};
  hold("rcL",-1);hold("rcR",1);hold("rcB","b");hold("gp3L",-1);hold("gp3R",1);
  $("rcF").addEventListener("pointerdown",ev=>{ev.preventDefault();if(R3)gpUseItem(R3.karts.find(x=>x.player));});
  R3.onResize=()=>{if(!R3)return;const w=canvas.clientWidth||720,h=Math.round(w*9/16);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};
  window.addEventListener("resize",R3.onResize);R3.onResize();
  setTimeout(()=>{const c=$("gp3Card");if(c)c.classList.add("hide");},3500);
  say("Grand Fable GP at "+C.name+". Three, two, one, go!");
  R3.raf=requestAnimationFrame(gpFrame);
}
let R3s_screen=null;const R3_balloons=[];
function gpMsg(m){if(!R3)return;const e=$("gp3Msg");if(e){e.textContent=m;e.classList.add("show");}R3.msgT=1.6;}
function gpUseItem(k){
  if(!R3||R3.done||R3.countdown>0||!k||!k.item)return;const it=k.item;k.item=null;
  if(it==="rocket"){k.boost=3;if(k.player){sfx("levelup");gpMsg("🚀 Rocket boost!");}}
  else if(it==="shield"){k.shield=8;if(k.player){sfx("tick");gpMsg("🛡️ Shield up!");}}
  else if(it==="banana"){R3.items.push(R3.mkBanana((k.t-0.012+1)%1,k.x));if(k.player){sfx("tick");gpMsg("🍌 Banana dropped!");}}
  else if(it==="orb"){const s=new R3.T.Mesh(new R3.T.SphereGeometry(0.7,12,10),new R3.T.MeshBasicMaterial({color:0x4dd2ff}));R3.scene.add(s);R3.shots.push({t:k.t,x:k.x,speed:k.speed+30,from:k,life:5,mesh:s});if(k.player){sfx("correct");gpMsg("🌀 Homing orb away!");}}
  if(k.player)gpHudItem();
}
function gpHit(k,cause){
  if(k.shield>0){k.shield=0;if(k.player){sfx("tick");gpMsg("🛡️ Shield blocked it!");}return;}
  k.spin=1.2;k.boost=0;if(k.player){sfx("wrong");gpMsg(cause==="orb"?"🌀 Hit by an orb!":"🍌 Banana spin!");}
}
function gpHudItem(){const k=R3&&R3.karts.find(x=>x.player);const e=$("gp3Item");if(e&&k)e.innerHTML=k.item?GP_ITEMS[k.item].e+'<small>⚡ USE</small>':'—<small>ITEM</small>';}
function gpFrame(now){
  if(!R3)return;
  const dt=Math.min(0.05,(now-R3.last)/1000);R3.last=now;
  if(R3.countdown>0){R3.countdown-=dt;const c=$("gp3Count");if(c){const n=Math.ceil(R3.countdown-0.3);c.textContent=n>0?String(n):"GO!";c.classList.add("show");if(R3.countdown<=0)setTimeout(()=>{const cc=$("gp3Count");if(cc)cc.classList.remove("show");},700);}}
  else if(!R3.done)R3.time=now-R3.t0-3500;
  gpUpdate(dt,R3.countdown>0);gpRender(dt);
  R3.raf=requestAnimationFrame(gpFrame);
}
function gpUpdate(dt,waiting){
  const {karts,samples,M,len,items}=R3;const me=karts.find(k=>k.player);
  const k=R3.keys;const left=k["arrowleft"]||k["a"]||R3.touchDir<0,right=k["arrowright"]||k["d"]||R3.touchDir>0,brake=k["arrowdown"]||k["s"]||R3.brake;
  karts.forEach(kt=>{
    const i=Math.floor(kt.t*M)%M;const s=samples[i],s2=samples[(i+4)%M];
    const curv=s.tan.clone().cross(s2.tan).y;         // + = turning left
    const offroad=Math.abs(kt.x)>1.05;
    const maxNow=waiting?0:kt.max*(kt.boost>0?1.35:1)*(kt.spin>0?0.3:1)*(offroad?0.45:1);
    if(kt.player&&brake&&!waiting)kt.speed=Math.max(0,kt.speed-40*dt);else kt.speed+=(maxNow-kt.speed)*Math.min(1,dt*(kt.speed<maxNow?kt.accel/10:3));
    const spd=kt.speed/kt.max;
    if(kt.spin>0){kt.spin-=dt;kt.x+=Math.sin(kt.spin*18)*dt*0.6;}
    else if(kt.player){if(left)kt.x-=dt*kt.steer*Math.max(.35,spd);if(right)kt.x+=dt*kt.steer*Math.max(.35,spd);}
    else{kt.wobble+=dt;const target=Math.sin(kt.wobble*0.5)*0.5;const ahead=karts.find(o=>o!==kt&&((o.t-kt.t+1)%1)<0.012&&Math.abs(o.x-kt.x)<0.35);kt.x+=((ahead?(kt.x<ahead.x?-0.7:0.7):target)-kt.x)*dt*(1.2+kt.racer.handle*0.2);
      kt.fireIn-=dt;if(kt.fireIn<=0&&!waiting&&!R3.done){kt.fireIn=10+Math.random()*10;if(!kt.item)kt.item=["orb","rocket","banana","shield"][Math.floor(Math.random()*4)];const gap=(me.t-kt.t+1)%1;if(kt.item==="orb"&&gap>0.005&&gap<0.12)gpUseItem(kt);else if(kt.item==="banana"&&gap>0.88)gpUseItem(kt);else if(kt.item==="rocket"||kt.item==="shield")gpUseItem(kt);}}
    kt.x-=curv*spd*dt*14;                                // drift outward on curves
    kt.x=Math.max(-1.7,Math.min(1.7,kt.x));
    if(kt.boost>0)kt.boost-=dt;if(kt.shield>0)kt.shield-=dt;
    const before=kt.t;kt.t=(kt.t+kt.speed*dt/len)%1;
    if(!waiting&&kt.t<before&&before>0.5&&!kt.started){kt.started=true;} // first crossing = leaving the grid
    else if(!waiting&&kt.t<before&&before>0.5){kt.lap++;if(kt.player){if(kt.lap>=R3.C.laps&&!R3.done)gpFinish();else{sfx("tick");gpMsg(kt.lap+1===R3.C.laps?"🏁 Final lap!":"Lap "+(kt.lap+1)+"!");if(R3s_screen)R3s_screen.material.map=gpTextTex("LAP "+(kt.lap+1),"#0b1f5c","#7cf",512,300,120);}}}
    // world position + orientation
    const pos=R3.curve.getPointAt(kt.t),tan=R3.curve.getTangentAt(kt.t).normalize(),nor=new R3.T.Vector3(-tan.z,0,tan.x);
    pos.addScaledVector(nor,kt.x*(R3.W-1.2));kt.pos.copy(pos);
    kt.g.position.copy(pos);if(offroad)kt.g.position.y=Math.abs(Math.sin(kt.t*len*3))*0.12;
    kt.g.lookAt(pos.clone().add(tan));kt.g.rotation.y+=(kt.spin>0?Math.sin(kt.spin*15)*0.9:0)+(kt.player?((right?-1:0)+(left?1:0))*0.12:0);
    kt.wheels.forEach(w=>w.rotation.x+=kt.speed*dt*1.4);
    kt.shieldMesh.visible=kt.shield>0;kt.flameMesh.visible=kt.boost>0;
    // items
    items.forEach(it=>{if(!it.alive)return;const d=(it.t-kt.t+1)%1;if(d<0.004&&Math.abs(it.x-kt.x)<0.35){
      if(it.kind==="box"){it.alive=false;it.mesh.visible=false;setTimeout(()=>{it.alive=true;it.mesh.visible=true;},7000);kt.boxes++;if(!kt.item){const pool=R3.place>=4&&kt.player?["rocket","rocket","orb","shield"]:["rocket","orb","shield","banana"];kt.item=pool[Math.floor(Math.random()*pool.length)];if(kt.player){sfx("correct");gpMsg("🎁 "+GP_ITEMS[kt.item].n+"!");gpHudItem();}}}
      else if(it.kind==="banana"&&kt.spin<=0){it.alive=false;it.mesh.visible=false;if(!it.dropped)setTimeout(()=>{it.alive=true;it.mesh.visible=true;},9000);gpHit(kt,"banana");}
    }});
  });
  // kart-kart bumps
  for(let a=0;a<karts.length;a++)for(let b=a+1;b<karts.length;b++){const A=karts[a],B=karts[b];const d=(A.t-B.t+1)%1;const close=d<0.004||d>0.996;if(close&&Math.abs(A.x-B.x)<0.42){const back=d<0.5?B:A,front=back===A?B:A;if(back.speed>front.speed)back.speed=front.speed*0.85;A.x+=(A.x<B.x?-1:1)*0.2;B.x-=(A.x<B.x?-1:1)*0.2;}}
  // homing orbs
  R3.shots=R3.shots.filter(s=>{s.life-=dt;s.t=(s.t+s.speed*dt/len)%1;let target=null,bd=1;karts.forEach(o=>{if(o===s.from)return;const d=(o.t-s.t+1)%1;if(d<0.09&&d<bd){bd=d;target=o;}});
    if(target){s.x+=(target.x-s.x)*dt*4;if(bd<0.004&&Math.abs(target.x-s.x)<0.45){gpHit(target,"orb");if(s.from.player){sfx("correct");gpMsg("🌀 Got "+target.racer.n+"!");}R3.scene.remove(s.mesh);return false;}}
    const pos=R3.curve.getPointAt(s.t),tan=R3.curve.getTangentAt(s.t),nor=new R3.T.Vector3(-tan.z,0,tan.x);pos.addScaledVector(nor,s.x*(R3.W-1.2));s.mesh.position.set(pos.x,1,pos.z);
    if(s.life<=0){R3.scene.remove(s.mesh);return false;}return true;});
  // item + balloon animation
  items.forEach(it=>{if(it.kind==="box"){it.mesh.rotation.y+=dt*1.5;it.mesh.rotation.x+=dt*0.7;}const pos=R3.curve.getPointAt(it.t),tan=R3.curve.getTangentAt(it.t),nor=new R3.T.Vector3(-tan.z,0,tan.x);pos.addScaledVector(nor,it.x*(R3.W-1.2));it.mesh.position.set(pos.x,it.kind==="box"?1.3+Math.sin(performance.now()/400+it.x)*0.2:0.9,pos.z);});
  R3_balloons.forEach(b=>{b.position.y+=Math.sin(performance.now()/900+b.userData.bob)*dt*0.6;});
  // standings
  const all=karts.slice().sort((a,b)=>(b.lap+b.t)-(a.lap+a.t));R3.board=all;R3.place=all.indexOf(me)+1;
  if(R3.msgT>0){R3.msgT-=dt;if(R3.msgT<=0){const e=$("gp3Msg");if(e)e.classList.remove("show");}}
  // HUD
  const el=(id,v)=>{const e=$(id);if(e&&e.textContent!==v)e.textContent=v;};
  el("gp3Lap","LAP "+Math.min(R3.C.laps,me.lap+1)+"/"+R3.C.laps+"  ·  "+gpOrd(R3.place).toUpperCase());el("gp3Time",gpFmt(Math.max(0,R3.time)));el("gp3Speed",Math.round(me.speed*3.2)+" km/h");
  const bd=$("gp3Board");if(bd){const html=all.map((k2,i)=>'<div class="'+(k2.player?"me":"")+'"><i style="background:'+k2.racer.css+'"></i>'+(i+1)+'. '+esc(k2.racer.n)+'</div>').join("");if(bd.innerHTML!==html)bd.innerHTML=html;}
  gpDrawMini($("gp3Map"),R3.C,karts);
}
function gpRender(dt){
  const me=R3.karts.find(k=>k.player);const tan=R3.curve.getTangentAt(me.t).normalize();
  const target=me.pos.clone().addScaledVector(tan,-10.5).add(new R3.T.Vector3(0,4.6,0));
  if(R3.countdown>0&&R3.camPos.lengthSq()===0)R3.camPos.copy(target);
  R3.camPos.lerp(target,Math.min(1,dt*5));R3.camera.position.copy(R3.camPos);
  R3.camera.lookAt(me.pos.clone().addScaledVector(tan,8).add(new R3.T.Vector3(0,1.6,0)));
  R3.renderer.render(R3.scene,R3.camera);
}
function gpFinish(){
  R3.done=true;const me=R3.karts.find(k=>k.player);const place=R3.place;const xp=[0,30,20,10,5,5][place]||5;
  sfx(place===1?"levelup":"correct");if(place===1)confetti();
  say(place===1?"You win the Grand Fable GP! Champion of "+R3.C.name+"!":"You finished "+gpOrd(place)+". Great driving!");
  let earned=0;
  if(P){earned=xp;P.xp+=xp;P.race=P.race||{};const prev=P.race[R3.C.id];P.race[R3.C.id]={time:prev&&prev.time<R3.time?prev.time:R3.time,place:Math.min(place,prev?prev.place:9),date:today()};
    if(place===1&&!P.trophies.some(t=>t.type==="race")&&typeof awardTrophy==="function")awardTrophy({type:"race",icon:"🏎️",label:"Grand Fable Champion",color:"#ffd166",detail:"Won the Grand Fable GP at "+R3.C.name+"."});save();}
  const podium=R3.board.slice(0,3).map((k,i)=>'<div class="gp-pod p'+(i+1)+'"><span>'+k.racer.e+'</span><b>'+gpOrd(i+1)+'</b><small>'+esc(k.racer.n)+'</small></div>').join("");
  setTimeout(()=>{if(!R3)return;const w=$("gp3");if(!w)return;w.insertAdjacentHTML("beforeend",'<div class="gp3-finish"><div class="gp3-fin-title">🏁 '+gpOrd(place).toUpperCase()+' PLACE</div><div class="gp-podium">'+podium+'</div><div class="gp3-fin-sub">'+gpFmt(R3.time)+' · 🎁 '+me.boxes+' boxes'+(earned?' · +'+earned+' XP':'')+'</div><div class="btn-row" style="margin-top:12px"><button class="btn big" onclick="startRace3D(\''+R3.C.id+'\')">Race again 🔁</button><button class="btn secondary big" onclick="renderCircuits()">Circuits 🏁</button><button class="btn secondary big" onclick="'+(P?'renderHome()':'renderProfiles()')+'">Home 🏠</button></div></div>');},1300);
}

<script>
"use strict";
/* ============================================================
   PRINCE'S LEARNING ZONE — offline adaptive learning app
   Ananse the Wise Lion · Ghanaian theme · ADHD-friendly
   ============================================================ */

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const app=$("app"), overlay=$("overlay");
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayOfYear=()=>{const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* Mix a hex color toward the brand ink — used for vivid gradient cards */
function shadeInk(hex,f){
  const h=String(hex).replace("#",""),to=[31,60,112];
  const r=parseInt(h.substr(0,2),16)||0,g=parseInt(h.substr(2,2),16)||0,b=parseInt(h.substr(4,2),16)||0;
  const m=(a,i)=>Math.round(a+(to[i]-a)*f);
  return "rgb("+m(r,0)+","+m(g,1)+","+m(b,2)+")";
}
const fmtTime=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

/* ---------- persistent storage ---------- */
const DBKEY="plz_v1";
function defaultDB(){return{profiles:[],pin:null,sound:true,telegram:{token:"",chat:"",time:"19:00",lastSent:""},ananse:{url:"",key:""},voice:{name:"",rate:1.0,pitch:1.05},kingdom:{enabled:true,v2:true},lastProfile:null}}
let DB; try{DB=JSON.parse(localStorage.getItem(DBKEY))||defaultDB()}catch(e){DB=defaultDB()}
if(!DB.ananse)DB.ananse={url:"",key:""};
if(!DB.plantnet)DB.plantnet={key:""};
if(!DB.voice)DB.voice={name:"",rate:1.0,pitch:1.05};
/* One-time upgrade: the old defaults (0.92 rate / 1.0 pitch) are the slow,
   flat delivery kids read as robotic. Lift anyone still on them, and drop a
   stale voice choice so the new neural-first ranking can pick a better one. */
if(!DB.voiceV2){
  if(!DB.voice.rate||Math.abs(DB.voice.rate-0.92)<0.001)DB.voice.rate=1.0;
  if(!DB.voice.pitch||Math.abs(DB.voice.pitch-1.0)<0.001)DB.voice.pitch=1.05;
  if(DB.voice.name&&!/premium|enhanced|natural|neural|siri/i.test(DB.voice.name))DB.voice.name="";
  DB.voiceV2=true;
}
if(!("lastProfile" in DB))DB.lastProfile=null;
/* the floating-portal home is now the default; the experimental 3D hub stays a parent opt-in */
if(!DB.kingdom||!DB.kingdom.v3)DB.kingdom={enabled:false,v3:true};
/* grade lessons + placement re-checks: fill in fields older profiles lack */
(DB.profiles||[]).forEach(p=>{if(!("grade" in p))p.grade=null;if(!p.lessons)p.lessons={};if(!p.diagHistory)p.diagHistory=p.diag?[p.diag]:[];if(!("retest" in p))p.retest=false;if(!p.lab)p.lab={};if(!p.reveal)p.reveal={};if(!("revealCurrent" in p))p.revealCurrent=null;});
function save(){try{
  localStorage.setItem(DBKEY,JSON.stringify(DB));
  // Guardian copy: any time we have real profile data, keep a second snapshot
  if(DB.profiles&&DB.profiles.length)localStorage.setItem("plz_guard",JSON.stringify({saved:Date.now(),data:DB}));
}catch(e){}}
/* Self-heal: if profiles ever vanish unexpectedly (stale tab overwrite,
   storage eviction), restore them from the guardian snapshot. */
try{
  if(!DB.profiles||!DB.profiles.length){
    const _g=JSON.parse(localStorage.getItem("plz_guard")||"null");
    if(_g&&_g.data&&_g.data.profiles&&_g.data.profiles.length){DB=_g.data;save();}
  }
}catch(e){}
/* ---------- mid-lesson auto-save & resume ---------- */
function sessSave(){
  try{
    if(!P||!S||S.mode!=="session")return;
    const c=Object.assign({},S,{brokeAt:Array.from(S.brokeAt||[])});
    DB.resume=DB.resume||{};
    DB.resume[P.id]={t:Date.now(),s:JSON.parse(JSON.stringify(c))};
    save();
  }catch(e){}
}
function sessClear(){try{if(DB.resume&&P&&DB.resume[P.id]){delete DB.resume[P.id];save();}}catch(e){}}
function sessTryResume(){
  try{
    const r=DB.resume&&P&&DB.resume[P.id];
    if(!r||!r.s||!r.s.cur)return false;
    if(Date.now()-r.t>86400000){delete DB.resume[P.id];save();return false;}
    S=r.s;S.brokeAt=new Set(S.brokeAt||[]);
    toast("✨ Continuing right where you left off");
    renderQuestion();
    return true;
  }catch(e){return false}
}
function sessResumeBtn(){if(!sessTryResume()){toast("Nothing to continue");renderHome();}}
let P=null; // active profile
let S=null; // active session

function newProfile(name,avatar){return{
  id:Date.now()+""+rnd(999),name,avatar,color:null,pin:null,created:today(),
  levels:{math:1,english:1,comprehension:1,science:1,history:1},
  diagDone:false,diag:null,diagHistory:[],retest:false,grade:null,lessons:{},lab:{},reveal:{},revealCurrent:null,
  trophies:[],streak:0,bestStreak:0,xp:0,
  stats:{speed:90,reading:80,memory:72,strategy:42,recall:38},
  sessions:[],sm2:{},wrongLog:[],
  daily:{date:"",done:false,ok:false},
  weeklyGoal:{topic:"",set:""},
  alertLog:{},
  askedAt:{}
}}

/* ---------- text-to-speech (Ananse's voice) ---------- */
let ananseVoice=null;
// Voice quality ranking: prefer enhanced/natural voices, known-good names,
// Ghanaian/African English accents; penalize macOS novelty voices.
const VOICE_PREF=["ava (premium)","ava (enhanced)","zoe (premium)","zoe (enhanced)","evan (enhanced)","nathan (enhanced)","joelle (enhanced)","serena (premium)","isha (premium)","ava","zoe","allison","evan","nathan","joelle","serena","stephanie","samantha","daniel","karen","moira","tessa","aaron","google uk english male","google uk english female","google us english"];
const VOICE_BAD=/compact|whisper|bells|bad news|good news|albert|zarvox|trinoids|boing|bubbles|cellos|wobble|organ|superstar|jester|grandma|grandpa|rocko|shelley|eddy|flo|reed|sandy|fred|junior|kathy|ralph|novelty/;
function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}}
function voiceScore(v){
  const n=(v.name||"").toLowerCase();
  let s=0;
  if(!v.lang||!v.lang.toLowerCase().startsWith("en"))return -999;
  // Modern neural voices are the big win for sounding human — weight them hard.
  if(/premium|enhanced|natural|neural|siri/.test(n))s+=140;
  if(/\(premium\)/.test(n))s+=40;      // premium beats enhanced
  if(/novelty|compact/.test(n))s-=200; // legacy robotic synths
  const i=VOICE_PREF.findIndex(p=>n.includes(p));
  if(i>=0)s+=60-i;
  if(/en[-_](GH|NG|ZA)/i.test(v.lang))s+=25;
  // device voices keep working offline; network voices go silent — prefer local strongly
  if(v.localService)s+=35;
  if(VOICE_BAD.test(n))s-=120;
  return s;
}
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=allVoices();
  if(!vs.length)return;
  if(DB.voice&&DB.voice.name){
    const m=vs.find(v=>v.name===DB.voice.name);
    if(m){ananseVoice=m;return;}
  }

function naturalise(t){

function voiceKey(t){
  return String(t).replace(/[*_#]/g,"").replace(/\s+/g," ").trim();
}

}
function sayRecorded(text){

function sayDevice(text){
  if(!DB.sound||!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}
    const clean=naturalise(String(text).replace(/[*_#]/g,""));
    const u=new SpeechSynthesisUtterance(clean);
    if(!ananseVoice)pickVoice();
    if(ananseVoice)u.voice=ananseVoice;
    u.rate=(DB.voice&&DB.voice.rate)||1.0;
    u.pitch=(DB.voice&&DB.voice.pitch)||1.05;

      // "interrupted"/"canceled" just means newer speech took over — never retry those
      const kind=e&&e.error;

let _ac=null, _ambient=null;
function audioCtx(){
  if(typeof window==="undefined")return null;

function _blip(freq,start,dur,type,vol){
  const a=audioCtx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();

  const t=a.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol==null?0.18:vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t);o.stop(t+dur+0.02);
}
function sfx(name){

    case "wrong":     _blip(200,0,0.18,"triangle",0.16);_blip(150,0.12,0.22,"triangle",0.16);break;
    case "levelup":   _blip(523,0,0.14,"square",0.13);_blip(659,0.12,0.14,"square",0.13);_blip(784,0.24,0.14,"square",0.13);_blip(1047,0.36,0.30,"square",0.14);break;
    case "celebrate": _blip(784,0,0.12,"sine",0.14);_blip(988,0.1,0.12,"sine",0.14);_blip(1319,0.2,0.12,"sine",0.14);_blip(1568,0.3,0.30,"sine",0.15);break;
    case "drum":      _blip(110,0,0.22,"sine",0.22);_blip(80,0.02,0.26,"triangle",0.18);break;
    case "tick":      _blip(880,0,0.05,"square",0.08);break;
